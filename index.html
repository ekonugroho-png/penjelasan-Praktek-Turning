<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="description" content="Pembelajaran Section Turning (LW) - Work Basic Skill Politeknik ATMI Surakarta. Materi mesin bubut, K3, ulir, alat ukur, gambar teknik, dan simulasi interaktif.">
<meta name="theme-color" content="#071426">
<title>Pembelajaran Section Turning (LW) | ATMI Surakarta</title>
<style>

/* ============================================
   SECTION TURNING (LW) — FUTURISTIC THEME
   Politeknik ATMI Surakarta
   ============================================ */

/* ---------- 1. CUSTOM PROPERTIES ---------- */
:root {
  /* Dark mode (default) */
  --c-bg:        #071426;
  --c-bg-2:      #0B1F3A;
  --c-surface:   rgba(11, 31, 58, 0.72);
  --c-surface-2: rgba(8, 22, 42, 0.85);
  --c-border:    rgba(0, 217, 255, 0.14);
  --c-border-hi: rgba(0, 217, 255, 0.42);
  --c-text:      #F8FAFC;
  --c-text-2:    #B9C9DD;
  --c-text-3:    #6B7E97;
  --c-primary:   #2563EB;
  --c-accent:    #00D9FF;
  --c-accent-2:  #67E8F9;
  --c-success:   #22D3A4;
  --c-warning:   #FBBF24;
  --c-danger:    #F87171;
  --c-info:      #60A5FA;

  --glow-cyan:   0 0 22px rgba(0, 217, 255, 0.35);
  --glow-blue:   0 0 22px rgba(37, 99, 235, 0.45);
  --shadow-card: 0 12px 38px -12px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,217,255,0.04);
  --shadow-pop:  0 30px 80px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(0,217,255,0.18);

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 28px;

  --header-h: 64px;
  --sidebar-w: 286px;
  --sidebar-w-collapsed: 76px;

  --t-fast: 150ms cubic-bezier(.2,.7,.3,1);
  --t-med:  240ms cubic-bezier(.2,.7,.3,1);
  --t-slow: 420ms cubic-bezier(.2,.7,.3,1);

  --font-ui: 'Inter', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif;
  --font-display: 'Orbitron', 'Inter', 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
}

[data-theme="light"] {
  --c-bg:        #F3F7FC;
  --c-bg-2:      #E8EFF8;
  --c-surface:   rgba(255, 255, 255, 0.85);
  --c-surface-2: rgba(255, 255, 255, 0.95);
  --c-border:    rgba(37, 99, 235, 0.12);
  --c-border-hi: rgba(37, 99, 235, 0.35);
  --c-text:      #0F172A;
  --c-text-2:    #475569;
  --c-text-3:    #94A3B8;
  --c-primary:   #2563EB;
  --c-accent:    #0891B2;
  --c-accent-2:  #06B6D4;
  --glow-cyan:   0 0 18px rgba(8, 145, 178, 0.22);
  --glow-blue:   0 0 18px rgba(37, 99, 235, 0.28);
  --shadow-card: 0 10px 28px -12px rgba(15, 23, 42, 0.18), 0 0 0 1px rgba(37,99,235,0.05);
  --shadow-pop:  0 30px 80px -20px rgba(15, 23, 42, 0.25), 0 0 0 1px rgba(37,99,235,0.15);
}

/* ---------- 2. RESET / BASE ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-ui);
  background: var(--c-bg);
  color: var(--c-text);
  line-height: 1.6;
  font-size: 15px;
  overflow: hidden; /* SPA — no body scroll */
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background-image:
    radial-gradient(1100px 700px at 88% -10%, rgba(0,217,255,0.10), transparent 60%),
    radial-gradient(900px 700px at -10% 110%, rgba(37,99,235,0.12), transparent 60%);
  background-attachment: fixed;
}
[data-theme="light"] body {
  background-image:
    radial-gradient(1100px 700px at 88% -10%, rgba(8,145,178,0.10), transparent 60%),
    radial-gradient(900px 700px at -10% 110%, rgba(37,99,235,0.10), transparent 60%);
}
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--c-accent); text-decoration: none; }
a:hover { text-decoration: underline; }
::selection { background: rgba(0,217,255,0.30); color: var(--c-text); }

/* Custom scrollbar */
* { scrollbar-width: thin; scrollbar-color: rgba(0,217,255,0.35) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: linear-gradient(var(--c-accent), var(--c-primary));
  border-radius: 8px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
*::-webkit-scrollbar-thumb:hover { background: var(--c-accent); background-clip: padding-box; border: 2px solid transparent; }

/* ---------- 3. APP SHELL LAYOUT ---------- */
.app {
  display: grid;
  grid-template-rows: var(--header-h) 1fr;
  grid-template-columns: var(--sidebar-w) 1fr;
  grid-template-areas:
    "header header"
    "sidebar content";
  height: 100dvh;
  height: 100vh; /* fallback */
  overflow: hidden;
}
.app[data-sidebar="collapsed"] { grid-template-columns: var(--sidebar-w-collapsed) 1fr; }

/* ---------- 4. HEADER ---------- */
.app-header {
  grid-area: header;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 18px;
  background: linear-gradient(180deg, rgba(7,20,38,0.95), rgba(7,20,38,0.85));
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--c-border);
  position: relative;
  z-index: 100;
}
[data-theme="light"] .app-header {
  background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(243,247,252,0.85));
}
.app-header::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--c-accent), transparent);
  opacity: .6;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-logo {
  width: 42px; height: 42px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--c-primary), var(--c-accent));
  display: grid; place-items: center;
  font-family: var(--font-display);
  font-weight: 800;
  color: #fff;
  box-shadow: var(--glow-blue);
  flex-shrink: 0;
  letter-spacing: -.5px;
  font-size: 14px;
  text-align: center;
  line-height: 1.05;
}
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: .4px;
  color: var(--c-text);
  line-height: 1.1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand-sub {
  font-size: 11px;
  color: var(--c-text-3);
  letter-spacing: .3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.header-spacer { flex: 1 1 auto; }
.header-tools { display: flex; align-items: center; gap: 8px; }

.icon-btn {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 10px;
  color: var(--c-text-2);
  cursor: pointer;
  transition: all var(--t-fast);
  flex-shrink: 0;
}
.icon-btn:hover {
  color: var(--c-accent);
  border-color: var(--c-border-hi);
  box-shadow: var(--glow-cyan);
  transform: translateY(-1px);
}
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn[aria-pressed="true"] { color: var(--c-accent); border-color: var(--c-border-hi); }

.search-wrap {
  position: relative;
  display: flex; align-items: center;
}
.search-wrap input {
  width: 220px;
  height: 38px;
  padding: 0 36px 0 36px;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 10px;
  color: var(--c-text);
  outline: none;
  transition: all var(--t-fast);
  font-size: 13px;
}
.search-wrap input::placeholder { color: var(--c-text-3); }
.search-wrap input:focus {
  border-color: var(--c-border-hi);
  box-shadow: var(--glow-cyan);
  width: 280px;
}
.search-wrap .search-icon {
  position: absolute; left: 10px;
  width: 16px; height: 16px;
  color: var(--c-text-3);
  pointer-events: none;
}
.search-results {
  position: absolute;
  top: calc(100% + 6px); right: 0;
  width: 360px; max-height: 60vh;
  background: var(--c-surface-2);
  border: 1px solid var(--c-border-hi);
  border-radius: 12px;
  box-shadow: var(--shadow-pop);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  overflow-y: auto;
  z-index: 200;
  display: none;
  padding: 6px;
}
.search-results.open { display: block; }
.search-result-item {
  display: block;
  padding: 9px 12px;
  border-radius: 8px;
  color: var(--c-text);
  cursor: pointer;
  transition: all var(--t-fast);
  text-decoration: none;
}
.search-result-item:hover { background: rgba(0,217,255,0.10); text-decoration: none; }
.search-result-item .sr-title { font-weight: 600; font-size: 13px; }
.search-result-item .sr-sub { font-size: 11px; color: var(--c-text-3); margin-top: 2px; }
.search-result-item mark { background: rgba(0,217,255,0.25); color: var(--c-accent-2); border-radius: 3px; padding: 0 2px; }
.search-empty { padding: 16px; text-align: center; color: var(--c-text-3); font-size: 13px; }

.theme-toggle {
  width: 56px; height: 30px;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 999px;
  position: relative;
  cursor: pointer;
  transition: all var(--t-fast);
  flex-shrink: 0;
}
.theme-toggle:hover { border-color: var(--c-border-hi); box-shadow: var(--glow-cyan); }
.theme-toggle::before {
  content: "";
  position: absolute;
  top: 3px; left: 3px;
  width: 22px; height: 22px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--c-accent), var(--c-primary));
  box-shadow: var(--glow-cyan);
  transition: transform var(--t-med);
}
[data-theme="light"] .theme-toggle::before { transform: translateX(26px); }
.theme-toggle .ti { position: absolute; top: 50%; transform: translateY(-50%); font-size: 12px; pointer-events: none; }
.theme-toggle .ti-moon { left: 8px; opacity: 1; }
.theme-toggle .ti-sun  { right: 8px; opacity: 0; }
[data-theme="light"] .theme-toggle .ti-moon { opacity: 0; }
[data-theme="light"] .theme-toggle .ti-sun  { opacity: 1; }

/* Sidebar toggle (mobile) */
.menu-toggle { display: none; }
@media (max-width: 1024px) {
  .menu-toggle { display: grid; }
  .search-wrap input { width: 150px; }
  .search-wrap input:focus { width: 200px; }
  .brand-text { display: none; }
}
@media (max-width: 640px) {
  .search-wrap { display: none; }
}

/* ---------- 5. SIDEBAR ---------- */
.app-sidebar {
  grid-area: sidebar;
  background: linear-gradient(180deg, rgba(11,31,58,0.85), rgba(7,20,38,0.85));
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-right: 1px solid var(--c-border);
  display: flex; flex-direction: column;
  overflow: hidden;
  position: relative;
  z-index: 90;
  transition: transform var(--t-med);
}
[data-theme="light"] .app-sidebar {
  background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(243,247,252,0.95));
}
.sidebar-head {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--c-border);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.sidebar-head h2 {
  margin: 0;
  font-size: 11px;
  letter-spacing: 1.4px;
  color: var(--c-text-3);
  text-transform: uppercase;
  font-weight: 600;
}
.sidebar-progress {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--c-text-3);
}
.progress-ring {
  width: 22px; height: 22px;
  position: relative;
}
.progress-ring svg { transform: rotate(-90deg); }
.progress-ring .ring-bg { fill: none; stroke: var(--c-border); stroke-width: 3; }
.progress-ring .ring-fg { fill: none; stroke: var(--c-accent); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset var(--t-med); }
.progress-ring .ring-pct {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font-size: 8px; font-weight: 700;
  color: var(--c-accent);
  font-family: var(--font-mono);
}

.sidebar-nav {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 8px 8px 18px;
  overscroll-behavior: contain;
}
.nav-group { margin-bottom: 4px; }
.nav-group-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.3px;
  color: var(--c-text-3);
  text-transform: uppercase;
  padding: 12px 12px 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: 10px;
  cursor: pointer;
  color: var(--c-text-2);
  transition: all var(--t-fast);
  border: 1px solid transparent;
  position: relative;
  text-decoration: none;
  font-size: 13.5px;
  user-select: none;
}
.nav-item:hover {
  background: rgba(0, 217, 255, 0.06);
  color: var(--c-text);
  border-color: var(--c-border);
}
.nav-item.active {
  background: linear-gradient(90deg, rgba(37,99,235,0.22), rgba(0,217,255,0.08));
  color: var(--c-accent-2);
  border-color: var(--c-border-hi);
  box-shadow: inset 0 0 14px rgba(0,217,255,0.10);
}
.nav-item.active::before {
  content: "";
  position: absolute; left: -8px; top: 8px; bottom: 8px;
  width: 3px;
  background: linear-gradient(var(--c-accent), var(--c-primary));
  border-radius: 3px;
  box-shadow: var(--glow-cyan);
}
.nav-item .ni-icon {
  width: 18px; height: 18px;
  flex-shrink: 0;
  display: grid; place-items: center;
}
.nav-item .ni-icon svg { width: 16px; height: 16px; }
.nav-item .ni-label { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item .ni-badge {
  font-size: 9px;
  font-family: var(--font-mono);
  padding: 2px 6px;
  background: rgba(0,217,255,0.10);
  border-radius: 6px;
  color: var(--c-accent);
  font-weight: 700;
  letter-spacing: .4px;
}
.nav-item.visited .ni-badge { background: rgba(34,211,164,0.16); color: var(--c-success); }
.nav-item.completed::after {
  content: "✓";
  color: var(--c-success);
  font-weight: 700;
  font-size: 11px;
}
.nav-sub {
  list-style: none; padding: 0; margin: 0;
  overflow: hidden;
  max-height: 0;
  transition: max-height var(--t-med);
}
.nav-item.expanded + .nav-sub { max-height: 800px; }
.nav-sub .nav-item { padding-left: 36px; font-size: 12.5px; }
.nav-sub .nav-item::before { display: none; }
.nav-item.has-sub::after {
  content: "▸";
  margin-left: auto;
  color: var(--c-text-3);
  font-size: 10px;
  transition: transform var(--t-fast);
}
.nav-item.has-sub.expanded::after { transform: rotate(90deg); }

.app[data-sidebar="collapsed"] .nav-item .ni-label,
.app[data-sidebar="collapsed"] .nav-item .ni-badge,
.app[data-sidebar="collapsed"] .nav-item.has-sub::after,
.app[data-sidebar="collapsed"] .nav-group-title,
.app[data-sidebar="collapsed"] .sidebar-head { display: none; }
.app[data-sidebar="collapsed"] .nav-item { justify-content: center; padding: 12px; }

/* Mobile drawer */
@media (max-width: 1024px) {
  .app { grid-template-columns: 1fr; grid-template-areas: "header" "content"; }
  .app-sidebar {
    position: fixed;
    top: var(--header-h); bottom: 0; left: 0;
    width: var(--sidebar-w);
    transform: translateX(-100%);
    z-index: 95;
  }
  .app[data-sidebar="open"] .app-sidebar { transform: translateX(0); box-shadow: var(--shadow-pop); }
  .app[data-sidebar="open"]::before {
    content: "";
    position: fixed; inset: var(--header-h) 0 0 0;
    background: rgba(0,0,0,0.55);
    z-index: 80;
    backdrop-filter: blur(2px);
  }
}

/* ---------- 6. CONTENT PANEL ---------- */
.app-content {
  grid-area: content;
  display: flex; flex-direction: column;
  overflow: hidden;
  position: relative;
}
.content-toolbar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 22px;
  border-bottom: 1px solid var(--c-border);
  background: var(--c-surface);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  flex-shrink: 0;
  min-height: 50px;
}
.crumb {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--c-text-3);
  flex: 1 1 auto;
  min-width: 0;
}
.crumb .sep { color: var(--c-text-3); opacity: .5; }
.crumb .cur { color: var(--c-text); font-weight: 600; }
.crumb .cur .sub { color: var(--c-text-3); font-weight: 400; margin-left: 4px; }
.menu-num {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  background: rgba(0,217,255,0.10);
  border: 1px solid var(--c-border);
  border-radius: 6px;
  color: var(--c-accent);
  letter-spacing: .5px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 8px;
  color: var(--c-text-2);
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 500;
  transition: all var(--t-fast);
  white-space: nowrap;
  text-decoration: none;
}
.btn:hover:not(:disabled) {
  color: var(--c-accent);
  border-color: var(--c-border-hi);
  box-shadow: var(--glow-cyan);
  transform: translateY(-1px);
  text-decoration: none;
}
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn svg { width: 14px; height: 14px; }
.btn.primary {
  background: linear-gradient(135deg, var(--c-primary), var(--c-accent));
  color: #fff;
  border-color: transparent;
  box-shadow: var(--glow-blue);
}
.btn.primary:hover:not(:disabled) { color: #fff; transform: translateY(-1px); box-shadow: 0 0 26px rgba(0,217,255,0.55); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--c-danger); border-color: rgba(248,113,113,0.30); }
.btn.danger:hover:not(:disabled) { background: rgba(248,113,113,0.08); border-color: var(--c-danger); box-shadow: 0 0 18px rgba(248,113,113,0.30); }

.material-select {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 8px;
  padding: 7px 26px 7px 10px;
  color: var(--c-text);
  font-size: 12.5px;
  cursor: pointer;
  outline: none;
  transition: all var(--t-fast);
  appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path fill='%2300D9FF' d='M5 7L0 2h10z'/></svg>");
  background-repeat: no-repeat;
  background-position: right 9px center;
  max-width: 240px;
}
.material-select:hover, .material-select:focus { border-color: var(--c-border-hi); box-shadow: var(--glow-cyan); }
.material-select option { background: var(--c-bg-2); color: var(--c-text); }

.content-scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  overscroll-behavior: contain;
  scroll-behavior: smooth;
}
.content-pane {
  padding: 28px clamp(16px, 4vw, 38px) 90px;
  max-width: 1280px;
  margin: 0 auto;
  animation: paneFade var(--t-med) ease;
}
@keyframes paneFade {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .content-pane { animation: none; }
  * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}

/* ---------- 7. TYPOGRAPHY ---------- */
.h-hero {
  font-family: var(--font-display);
  font-size: clamp(28px, 4.5vw, 46px);
  font-weight: 800;
  line-height: 1.05;
  letter-spacing: -.5px;
  margin: 0 0 12px;
  background: linear-gradient(120deg, var(--c-text) 0%, var(--c-accent-2) 60%, var(--c-accent) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.h-1 {
  font-family: var(--font-display);
  font-size: clamp(22px, 2.6vw, 30px);
  font-weight: 700;
  margin: 36px 0 16px;
  line-height: 1.2;
  letter-spacing: -.2px;
  display: flex; align-items: center; gap: 12px;
}
.h-1::before {
  content: "";
  display: inline-block;
  width: 4px; height: 24px;
  background: linear-gradient(var(--c-accent), var(--c-primary));
  border-radius: 4px;
  box-shadow: var(--glow-cyan);
  flex-shrink: 0;
}
.h-2 {
  font-size: 19px;
  font-weight: 700;
  margin: 28px 0 12px;
  color: var(--c-text);
  letter-spacing: -.1px;
}
.h-3 {
  font-size: 15px;
  font-weight: 700;
  margin: 18px 0 8px;
  color: var(--c-accent-2);
  letter-spacing: .2px;
  text-transform: uppercase;
}
.h-4 {
  font-size: 13.5px;
  font-weight: 700;
  margin: 14px 0 6px;
  color: var(--c-text-2);
}
p { margin: 0 0 12px; color: var(--c-text-2); line-height: 1.72; }
strong { color: var(--c-text); font-weight: 600; }
.lead { font-size: 16px; color: var(--c-text-2); line-height: 1.75; }
.mono { font-family: var(--font-mono); }
.kbd {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 2px 6px;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 4px;
  color: var(--c-accent-2);
}
ul, ol { margin: 0 0 14px; padding-left: 22px; }
ul li, ol li { margin: 4px 0; color: var(--c-text-2); line-height: 1.65; }
ul li::marker { color: var(--c-accent); }
ul.check { list-style: none; padding-left: 0; }
ul.check li { position: relative; padding-left: 26px; }
ul.check li::before {
  content: "✓";
  position: absolute; left: 0; top: 0;
  color: var(--c-success);
  font-weight: 700;
}
ul.cross { list-style: none; padding-left: 0; }
ul.cross li { position: relative; padding-left: 26px; }
ul.cross li::before {
  content: "✕";
  position: absolute; left: 0; top: 0;
  color: var(--c-danger);
  font-weight: 700;
}

/* ---------- 8. CARDS ---------- */
.card {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  padding: 20px;
  box-shadow: var(--shadow-card);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: all var(--t-fast);
  margin-bottom: 16px;
  position: relative;
}
.card:hover {
  border-color: var(--c-border-hi);
  transform: translateY(-2px);
  box-shadow: var(--shadow-pop);
}
.card.glow::before {
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  padding: 1px;
  background: linear-gradient(135deg, var(--c-accent), transparent 40%, var(--c-primary));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  opacity: .8;
}
.card-title {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  margin: 0 0 10px;
  color: var(--c-text);
  letter-spacing: -.1px;
  display: flex; align-items: center; gap: 10px;
}
.card-title .ct-ico {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--c-primary), var(--c-accent));
  border-radius: 8px;
  color: #fff;
  flex-shrink: 0;
}
.card-title .ct-ico svg { width: 16px; height: 16px; }

.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
@media (max-width: 920px) {
  .grid-3, .grid-4 { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}

/* Stat / KPI */
.stat {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  padding: 16px;
  text-align: left;
  position: relative;
  overflow: hidden;
  transition: all var(--t-fast);
}
.stat:hover { border-color: var(--c-border-hi); transform: translateY(-2px); }
.stat::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--c-accent), var(--c-primary));
}
.stat .stat-val {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 800;
  color: var(--c-accent-2);
  letter-spacing: -.5px;
  line-height: 1;
}
.stat .stat-lbl {
  font-size: 11px;
  color: var(--c-text-3);
  margin-top: 6px;
  letter-spacing: .4px;
  text-transform: uppercase;
}

/* ---------- 9. CALLOUTS ---------- */
.callout {
  display: flex;
  gap: 14px;
  padding: 14px 16px;
  border-radius: var(--r-md);
  border-left: 4px solid var(--c-info);
  background: rgba(96, 165, 250, 0.08);
  margin: 14px 0;
  align-items: flex-start;
}
.callout .co-ico { flex-shrink: 0; width: 22px; height: 22px; color: var(--c-info); margin-top: 1px; }
.callout .co-body { flex: 1 1 auto; min-width: 0; }
.callout .co-title { font-weight: 700; color: var(--c-text); margin-bottom: 4px; font-size: 13.5px; }
.callout p { margin: 0; font-size: 13.5px; }
.callout.warning { border-left-color: var(--c-warning); background: rgba(251, 191, 36, 0.08); }
.callout.warning .co-ico { color: var(--c-warning); }
.callout.danger  { border-left-color: var(--c-danger); background: rgba(248, 113, 113, 0.10); }
.callout.danger  .co-ico { color: var(--c-danger); }
.callout.success { border-left-color: var(--c-success); background: rgba(34, 211, 164, 0.08); }
.callout.success .co-ico { color: var(--c-success); }
.callout.accent  { border-left-color: var(--c-accent); background: rgba(0, 217, 255, 0.07); }
.callout.accent  .co-ico { color: var(--c-accent); }

/* ---------- 10. TABLES ---------- */
.table-wrap {
  overflow-x: auto;
  border-radius: var(--r-md);
  border: 1px solid var(--c-border);
  background: var(--c-surface);
  margin: 14px 0;
  -webkit-overflow-scrolling: touch;
}
.table-wrap table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
  min-width: 540px;
}
.table-wrap th, .table-wrap td {
  padding: 11px 14px;
  text-align: left;
  border-bottom: 1px solid var(--c-border);
  vertical-align: top;
}
.table-wrap th {
  background: linear-gradient(180deg, rgba(0,217,255,0.06), rgba(37,99,235,0.06));
  color: var(--c-text);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: .5px;
  text-transform: uppercase;
  position: sticky;
  top: 0;
  z-index: 1;
}
.table-wrap tbody tr:hover { background: rgba(0,217,255,0.04); }
.table-wrap td.num, .table-wrap th.num { text-align: right; font-family: var(--font-mono); }
.table-wrap td.center, .table-wrap th.center { text-align: center; }
.table-wrap .badge-cell .badge { display: inline-block; }

/* ---------- 11. BADGES / PILLS ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  letter-spacing: .3px;
  text-transform: uppercase;
  background: rgba(0,217,255,0.10);
  color: var(--c-accent);
  border: 1px solid var(--c-border);
}
.badge.warning { background: rgba(251,191,36,0.12); color: var(--c-warning); border-color: rgba(251,191,36,0.25); }
.badge.danger  { background: rgba(248,113,113,0.12); color: var(--c-danger);  border-color: rgba(248,113,113,0.30); }
.badge.success { background: rgba(34,211,164,0.12); color: var(--c-success); border-color: rgba(34,211,164,0.25); }
.badge.info    { background: rgba(96,165,250,0.12); color: var(--c-info);    border-color: rgba(96,165,250,0.25); }
.badge.muted   { background: rgba(107,126,151,0.12); color: var(--c-text-3); border-color: rgba(107,126,151,0.20); }

/* ---------- 12. IMAGE / FIGURE ---------- */
.figure {
  margin: 16px 0;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  padding: 12px;
  text-align: center;
  overflow: hidden;
}
.figure img {
  width: auto; max-width: 100%;
  height: auto; max-height: 460px;
  margin: 0 auto;
  border-radius: 8px;
  cursor: zoom-in;
  transition: transform var(--t-med);
}
.figure img:hover { transform: scale(1.02); }
.figure .fig-cap {
  font-size: 12px;
  color: var(--c-text-3);
  margin-top: 10px;
  font-style: italic;
  letter-spacing: .2px;
}
.figure .fig-cap strong { color: var(--c-text-2); font-style: normal; }
.figure.zoomable { cursor: zoom-in; }

.img-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
  margin: 16px 0;
}
.img-tile {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 10px;
  overflow: hidden;
  cursor: zoom-in;
  transition: all var(--t-fast);
}
.img-tile:hover { border-color: var(--c-border-hi); transform: translateY(-2px); box-shadow: var(--shadow-pop); }
.img-tile img { width: 100%; height: 160px; object-fit: cover; background: #fff; }
.img-tile .it-cap { padding: 8px 10px; font-size: 11.5px; color: var(--c-text-2); border-top: 1px solid var(--c-border); }

/* ---------- 13. ACCORDION ---------- */
.acc { margin: 12px 0; border: 1px solid var(--c-border); border-radius: var(--r-md); overflow: hidden; background: var(--c-surface); }
.acc-item { border-bottom: 1px solid var(--c-border); }
.acc-item:last-child { border-bottom: none; }
.acc-head {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 16px;
  cursor: pointer;
  background: transparent;
  border: none;
  width: 100%;
  text-align: left;
  color: var(--c-text);
  font-weight: 600;
  font-size: 14px;
  transition: background var(--t-fast);
}
.acc-head:hover { background: rgba(0,217,255,0.05); }
.acc-head .acc-ico {
  width: 22px; height: 22px;
  display: grid; place-items: center;
  border: 1px solid var(--c-border);
  border-radius: 6px;
  color: var(--c-accent);
  font-size: 12px;
  transition: all var(--t-fast);
  flex-shrink: 0;
}
.acc-item.open .acc-ico { background: var(--c-accent); color: #fff; transform: rotate(90deg); }
.acc-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height var(--t-med);
  padding: 0 16px;
}
.acc-item.open .acc-body { max-height: 1200px; padding: 0 16px 14px; }

/* ---------- 14. STEPS ---------- */
.steps { counter-reset: step; margin: 14px 0; padding: 0; list-style: none; }
.steps li {
  position: relative;
  padding: 12px 14px 12px 56px;
  margin-bottom: 8px;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  color: var(--c-text-2);
  counter-increment: step;
}
.steps li::before {
  content: counter(step);
  position: absolute;
  left: 12px; top: 50%; transform: translateY(-50%);
  width: 30px; height: 30px;
  background: linear-gradient(135deg, var(--c-primary), var(--c-accent));
  color: #fff;
  border-radius: 50%;
  display: grid; place-items: center;
  font-weight: 700;
  font-family: var(--font-mono);
  font-size: 13px;
  box-shadow: var(--glow-cyan);
}

/* ---------- 15. FORM ---------- */
.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--c-text-2);
  letter-spacing: .3px;
}
.input, .select, .textarea {
  width: 100%;
  padding: 10px 12px;
  background: var(--c-surface-2);
  border: 1px solid var(--c-border);
  border-radius: 8px;
  color: var(--c-text);
  outline: none;
  font-size: 13.5px;
  transition: all var(--t-fast);
}
.input:focus, .select:focus, .textarea:focus { border-color: var(--c-border-hi); box-shadow: var(--glow-cyan); }
.range {
  width: 100%;
  -webkit-appearance: none;
  appearance: none;
  height: 6px;
  background: var(--c-surface-2);
  border-radius: 999px;
  outline: none;
  border: 1px solid var(--c-border);
}
.range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px; height: 18px;
  background: linear-gradient(135deg, var(--c-accent), var(--c-primary));
  border-radius: 50%;
  cursor: pointer;
  box-shadow: var(--glow-cyan);
  border: 2px solid var(--c-bg);
}
.range::-moz-range-thumb {
  width: 18px; height: 18px;
  background: var(--c-accent);
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid var(--c-bg);
}

/* ---------- 16. LIGHTBOX ---------- */
.lightbox {
  position: fixed; inset: 0;
  background: rgba(2, 6, 18, 0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 24px;
}
.lightbox.open { display: flex; animation: paneFade var(--t-med) ease; }
.lightbox img {
  max-width: 92vw;
  max-height: 80vh;
  border-radius: 12px;
  box-shadow: var(--shadow-pop);
  background: #fff;
}
.lightbox .lb-cap {
  margin-top: 14px;
  color: var(--c-text-2);
  font-size: 13px;
  text-align: center;
  max-width: 720px;
}
.lightbox .lb-close {
  position: absolute; top: 18px; right: 18px;
  width: 42px; height: 42px;
  background: var(--c-surface);
  border: 1px solid var(--c-border-hi);
  border-radius: 10px;
  color: var(--c-text);
  cursor: pointer;
  display: grid; place-items: center;
  font-size: 22px;
  transition: all var(--t-fast);
}
.lightbox .lb-close:hover { background: var(--c-danger); color: #fff; }
.lightbox .lb-nav {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  width: 46px; height: 46px;
  background: var(--c-surface);
  border: 1px solid var(--c-border-hi);
  border-radius: 50%;
  color: var(--c-text);
  cursor: pointer;
  display: grid; place-items: center;
  font-size: 22px;
  transition: all var(--t-fast);
}
.lightbox .lb-nav:hover { background: var(--c-accent); color: #fff; box-shadow: var(--glow-cyan); }
.lightbox .lb-prev { left: 18px; }
.lightbox .lb-next { right: 18px; }
.lightbox .lb-tools {
  position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px;
}
.lightbox .lb-tools .btn { background: var(--c-surface-2); }

/* ---------- 17. HERO / BERANDA ---------- */
.hero {
  position: relative;
  border-radius: var(--r-xl);
  padding: 40px clamp(20px, 4vw, 48px);
  background: linear-gradient(135deg, rgba(11,31,58,0.85), rgba(7,20,38,0.95));
  border: 1px solid var(--c-border-hi);
  overflow: hidden;
  margin-bottom: 24px;
}
[data-theme="light"] .hero { background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(232,239,248,0.95)); }
.hero::before {
  content: "";
  position: absolute;
  top: -50%; right: -20%;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(0,217,255,0.20), transparent 60%);
  pointer-events: none;
}
.hero::after {
  content: "";
  position: absolute;
  bottom: -30%; left: -10%;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(37,99,235,0.18), transparent 60%);
  pointer-events: none;
}
.hero > * { position: relative; z-index: 1; }
.hero .hero-tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.4px;
  color: var(--c-accent);
  padding: 5px 10px;
  border: 1px solid var(--c-border-hi);
  border-radius: 999px;
  background: rgba(0,217,255,0.06);
  margin-bottom: 16px;
}
.hero .hero-tag::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c-accent);
  box-shadow: 0 0 8px var(--c-accent);
  animation: pulse 1.6s infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.hero .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }

/* Hero stats */
.hero-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-top: 28px;
}
@media (max-width: 720px) { .hero-stats { grid-template-columns: repeat(2, 1fr); } }

/* Quick cards */
.quick-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; margin-top: 14px; }
.quick-card {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  padding: 16px;
  cursor: pointer;
  transition: all var(--t-fast);
  text-decoration: none;
  color: var(--c-text);
  position: relative;
  overflow: hidden;
}
.quick-card:hover {
  border-color: var(--c-border-hi);
  transform: translateY(-3px);
  box-shadow: var(--shadow-pop);
  text-decoration: none;
}
.quick-card .qc-ico {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--c-primary), var(--c-accent));
  border-radius: 10px;
  display: grid; place-items: center;
  color: #fff;
  margin-bottom: 10px;
}
.quick-card .qc-ico svg { width: 18px; height: 18px; }
.quick-card .qc-title { font-weight: 700; font-size: 14px; color: var(--c-text); margin-bottom: 4px; }
.quick-card .qc-sub { font-size: 12px; color: var(--c-text-3); }
.quick-card .qc-arrow { position: absolute; top: 14px; right: 14px; color: var(--c-text-3); transition: transform var(--t-fast); }
.quick-card:hover .qc-arrow { transform: translate(3px, -3px); color: var(--c-accent); }

/* ---------- 18. SIMULATORS ---------- */
.sim-shell {
  background: var(--c-surface);
  border: 1px solid var(--c-border-hi);
  border-radius: var(--r-lg);
  padding: 22px;
  margin: 18px 0;
  box-shadow: var(--shadow-pop);
  position: relative;
  overflow: hidden;
}
.sim-shell::before {
  content: "SIMULATOR";
  position: absolute;
  top: 12px; right: 14px;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 1.6px;
  color: var(--c-text-3);
  font-weight: 700;
}
.sim-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  align-items: start;
}
@media (max-width: 880px) { .sim-grid { grid-template-columns: 1fr; } }
.sim-canvas {
  background: linear-gradient(135deg, rgba(7,20,38,0.85), rgba(11,31,58,0.85));
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  padding: 18px;
  display: grid; place-items: center;
  min-height: 280px;
}
[data-theme="light"] .sim-canvas { background: linear-gradient(135deg, #F8FAFC, #E8EFF8); }
.sim-readout {
  font-family: var(--font-display);
  font-size: clamp(34px, 6vw, 56px);
  font-weight: 800;
  color: var(--c-accent-2);
  text-shadow: var(--glow-cyan);
  letter-spacing: -.5px;
  line-height: 1;
}
.sim-readout-sub {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--c-text-3);
  margin-top: 8px;
  letter-spacing: .4px;
}
.sim-controls { display: flex; flex-direction: column; gap: 14px; }
.sim-result {
  background: linear-gradient(135deg, rgba(0,217,255,0.10), rgba(37,99,235,0.06));
  border: 1px solid var(--c-border-hi);
  border-radius: var(--r-md);
  padding: 16px;
  margin-top: 12px;
}
.sim-result .sr-label { font-size: 11px; color: var(--c-text-3); letter-spacing: .4px; text-transform: uppercase; }
.sim-result .sr-value { font-family: var(--font-display); font-size: 30px; font-weight: 800; color: var(--c-accent-2); margin-top: 4px; }

/* SVG simulator styles */
.dial-caliper-svg, .micrometer-svg {
  width: 100%;
  height: auto;
  max-width: 460px;
  max-height: 320px;
}
.dial-caliper-svg .scale-text, .micrometer-svg .scale-text {
  font-family: var(--font-mono);
  fill: var(--c-text);
  font-size: 11px;
  font-weight: 700;
}
.dial-caliper-svg .needle { transition: transform var(--t-med); transform-origin: center; }
.dial-caliper-svg .sleeve { transition: transform var(--t-med); }
.micrometer-svg .thimble { transition: transform var(--t-med); transform-origin: center; }

/* Quiz */
.quiz-q {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  padding: 16px;
  margin-bottom: 14px;
}
.quiz-q .qq-num { font-family: var(--font-mono); font-size: 11px; color: var(--c-accent); letter-spacing: .5px; }
.quiz-q .qq-text { font-weight: 600; color: var(--c-text); margin: 4px 0 10px; font-size: 14px; }
.quiz-options { display: flex; flex-direction: column; gap: 6px; }
.quiz-opt {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  background: var(--c-surface-2);
  border: 1px solid var(--c-border);
  border-radius: 8px;
  cursor: pointer;
  transition: all var(--t-fast);
}
.quiz-opt:hover { border-color: var(--c-border-hi); background: rgba(0,217,255,0.04); }
.quiz-opt.selected { border-color: var(--c-accent); background: rgba(0,217,255,0.08); box-shadow: var(--glow-cyan); }
.quiz-opt.correct { border-color: var(--c-success); background: rgba(34,211,164,0.10); }
.quiz-opt.wrong { border-color: var(--c-danger); background: rgba(248,113,113,0.10); }
.quiz-opt .qo-ico {
  width: 22px; height: 22px;
  border: 1.5px solid var(--c-border-hi);
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.quiz-opt.selected .qo-ico { background: var(--c-accent); color: #fff; border-color: var(--c-accent); }
.quiz-opt.correct .qo-ico { background: var(--c-success); color: #fff; border-color: var(--c-success); }
.quiz-opt.wrong .qo-ico { background: var(--c-danger); color: #fff; border-color: var(--c-danger); }
.quiz-explain {
  margin-top: 10px;
  padding: 10px 12px;
  background: rgba(0,217,255,0.06);
  border-left: 3px solid var(--c-accent);
  border-radius: 6px;
  font-size: 13px;
  color: var(--c-text-2);
  display: none;
}
.quiz-explain.show { display: block; animation: paneFade var(--t-fast); }
.quiz-score {
  display: flex; align-items: center; gap: 16px;
  padding: 16px;
  background: linear-gradient(135deg, rgba(0,217,255,0.10), rgba(37,99,235,0.06));
  border: 1px solid var(--c-border-hi);
  border-radius: var(--r-md);
  margin-top: 14px;
}
.quiz-score .qs-val { font-family: var(--font-display); font-size: 36px; font-weight: 800; color: var(--c-accent-2); }

/* Tooltip */
.term { border-bottom: 1.5px dotted var(--c-accent); cursor: help; position: relative; color: var(--c-accent-2); }
.term:hover .term-tip { opacity: 1; visibility: visible; transform: translate(-50%, -8px); }
.term-tip {
  position: absolute;
  bottom: 100%; left: 50%;
  transform: translate(-50%, 0);
  background: var(--c-surface-2);
  border: 1px solid var(--c-border-hi);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 11.5px;
  color: var(--c-text);
  min-width: 200px; max-width: 300px;
  z-index: 50;
  opacity: 0; visibility: hidden;
  transition: all var(--t-fast);
  box-shadow: var(--shadow-pop);
  text-align: left;
  line-height: 1.5;
  pointer-events: none;
}

/* Glosarium */
.glos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.glos-item {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  padding: 14px;
  transition: all var(--t-fast);
}
.glos-item:hover { border-color: var(--c-border-hi); transform: translateY(-1px); }
.glos-item .gt-term { font-weight: 700; color: var(--c-accent-2); font-family: var(--font-display); font-size: 14px; margin-bottom: 4px; }
.glos-item .gt-def { font-size: 12.5px; color: var(--c-text-2); line-height: 1.55; }

/* Gallery */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
  margin-top: 14px;
}
.gallery-card {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  overflow: hidden;
  cursor: pointer;
  transition: all var(--t-fast);
  display: flex; flex-direction: column;
}
.gallery-card:hover { border-color: var(--c-border-hi); transform: translateY(-3px); box-shadow: var(--shadow-pop); }
.gallery-card .gc-img {
  aspect-ratio: 4/3;
  background: #fff;
  display: grid; place-items: center;
  overflow: hidden;
}
.gallery-card .gc-img img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.gallery-card .gc-body { padding: 10px 12px; flex: 1; }
.gallery-card .gc-title { font-weight: 700; font-size: 13px; color: var(--c-text); margin-bottom: 4px; line-height: 1.3; }
.gallery-card .gc-meta { font-size: 11px; color: var(--c-text-3); }
.gallery-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.gallery-chip {
  font-size: 12px;
  padding: 6px 12px;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 999px;
  color: var(--c-text-2);
  cursor: pointer;
  transition: all var(--t-fast);
}
.gallery-chip:hover { border-color: var(--c-border-hi); color: var(--c-text); }
.gallery-chip.active { background: var(--c-accent); color: #fff; border-color: transparent; }

/* Footer of content */
.content-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-top: 28px; padding-top: 18px;
  border-top: 1px solid var(--c-border);
  flex-wrap: wrap;
}
.foot-nav { display: flex; gap: 8px; flex-wrap: wrap; }

/* Helpers */
.text-accent { color: var(--c-accent); }
.text-primary { color: var(--c-primary); }
.text-success { color: var(--c-success); }
.text-warning { color: var(--c-warning); }
.text-danger { color: var(--c-danger); }
.text-muted { color: var(--c-text-3); }
.text-mono { font-family: var(--font-mono); }
.text-center { text-align: center; }
.text-right { text-align: right; }
.flex { display: flex; }
.flex-wrap { flex-wrap: wrap; }
.gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; }
.mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; }
.mb-2 { margin-bottom: 8px; } .mb-3 { margin-bottom: 12px; } .mb-4 { margin-bottom: 16px; }
.hidden { display: none !important; }
.nowrap { white-space: nowrap; }

/* Mobile safe area */
@supports (padding: max(0px)) {
  .app-header { padding-left: max(18px, env(safe-area-inset-left)); padding-right: max(18px, env(safe-area-inset-right)); }
  .content-pane { padding-bottom: max(90px, calc(env(safe-area-inset-bottom) + 60px)); }
}

/* Tooltip on small screens */
@media (max-width: 640px) {
  .term-tip { position: fixed; left: 16px !important; right: 16px; bottom: 80px; transform: none; min-width: 0; }
}


/* ===========================================================
   TURNING LAB / VISUAL SYSTEM 2026
   Clean engineering editorial · low-noise futuristic UI
   Non-destructive design layer: content, functions unchanged.

:root {

  --c-accent-2: #79e6d7;
  --c-success: #4ddaab;
  --c-warning: #ffcd73;
  --c-danger: #ff8b93;
  --c-info: #85b9ff;
  --glow-cyan: 0 0 0 3px rgba(98,219,201,.10);
  --glow-blue: 0 0 0 3px rgba(53,124,242,.12);
  --shadow-card: 0 12px 32px -22px rgba(0,0,0,.60);

  --header-h: 76px;
  --sidebar-w: 268px;
  --sidebar-w-collapsed: 72px;
  --r-sm: 10px;
  --r-md: 15px;
  --r-lg: 20px;
  --r-xl: 23px;
}
[data-theme="light"] {
  --c-bg: #f2f6fa;
  --c-bg-2: #e9f0f6;
  --c-surface: #fff;
  --c-surface-2: #f9fbfe;
  --c-border: rgba(32,76,109,.14);
  --c-border-hi: rgba(19,137,137,.48);
  --c-text: #102739;
  --c-text-2: #405d72;
  --c-text-3: #687f93;
  --c-accent: #127f81;
  --c-accent-2: #0e777c;
  --c-primary: #236bd1;
  --glow-cyan: 0 0 0 3px rgba(18,127,129,.12);

}
html { scroll-behavior: auto; }

.app { height: 100vh; height: 100dvh; min-width: 0; }

.app[data-sidebar="collapsed"] .nav-sub { border:0; margin:0; padding:0; }

.app[data-sidebar="collapsed"] .nav-item { justify-content:center; }
.app[data-sidebar="collapsed"] .nav-item.has-sub.expanded + .nav-sub { max-height:0; }
.app-content { min-width:0; background:transparent; }
.content-toolbar {
  display:grid; grid-template-columns:auto minmax(110px,1fr) auto minmax(150px,222px) auto;
  gap:10px; align-items:center; min-height:64px;
  padding:10px clamp(18px,2.8vw,37px);

}
[data-theme="light"] .content-toolbar { background:rgba(255,255,255,.75); }
.crumb { font-size:12px; white-space:nowrap; overflow:hidden; }
.crumb .cur { font-weight:700; overflow:hidden; text-overflow:ellipsis; }
.menu-num { font-size:11px; font-weight:600; background:var(--c-surface); padding:7px 10px; border-radius:8px; }
.btn {

}

.h-3 { font-size:13px; letter-spacing:.2px; color:var(--c-accent-2); text-transform:none; }
.h-4 { font-size:13.5px; color:var(--c-text); }
p { color:var(--c-text-2); line-height:1.75; }
.lead { color:var(--c-text-2); font-size:15.5px; line-height:1.7; }
strong { font-weight:700; }

.badge { font-size:10.5px; text-transform:none; letter-spacing:0; }

.figure .fig-cap { font-style:normal; color:var(--c-text-3); line-height:1.5; }

.sim-result,.quiz-score { background:var(--c-surface-2); }

  margin:0 0 34px;

<h1 class="h-1">Keselamatan &amp; Kesehatan Kerja (K3)</h1>
<p class="lead">Keselamatan kerja adalah prioritas tertinggi di Section Turning. Benda kerja berputar dengan kecepatan tinggi,
pahat potong tajam, dan tatal/chip dapat melukai. Kepatuhan terhadap prosedur K3 bukan sekadar aturan —
ia melindungi nyawa dan karier Anda sebagai teknisi pemesinan.</p>

      <li><strong>DILARANG MENGAMBIL CHIP DENGAN TANGAN KOSONG!</strong></li>

<h2 class="h-2">Alat Pelindung Diri (APD)</h2>
<p>Setiap mahasiswa wajib memakai APD lengkap sebelum memasuki area mesin. APD yang tidak lengkap atau tidak
rapi dapat menyebabkan mahasiswa dikenai sanksi atau bahkan diminta pulang. Foto berikut memperlihatkan
contoh APD yang benar:</p>
<div class="card">
  <div class="card-title"><span class="ct-ico">${ICONS.shield}</span>Contoh APD yang Benar</div>
  <div class="figure zoomable"><img src="assets/img/section_lw/section_lw_image17.jpg" alt="Contoh APD yang benar — wearpack, safety shoes, name tag" style="max-height:520px"><div class="fig-cap"><strong>Sumber:</strong> Section LW Arrupe (1).pptx — Slide 5</div></div>
</div>

<div class="grid-2">
  <div class="card">
    <div class="card-title">Wearpack &amp; Name Tag</div>
    <ul class="check">
      <li>Memakai <strong>wearpack</strong> sesuai, rapi, dan bersih.</li>
      <li>Menggunakan <strong>name tag</strong> sesuai nama dan sudah dijahit rapi.</li>
      <li>Gunakan celana berbahan <strong>kain</strong>. Saat di bengkel wajib menggunakan celana kain agar saat terjadi kecelakaan bukan tubuh yang terseret spindel, tetapi kain yang sobek.</li>

  </div>
  <div class="card">
    <div class="card-title">Safety Shoes</div>
    <ul class="check">
      <li>Memakai <strong>safety shoes</strong> agar tidak terpeleset.</li>

    </ul>
  </div>
  <div class="card">
    <div class="card-title">Kacamata Safety</div>
    <ul class="check">

    <div class="card-title">Penggunaan Chuck &amp; Kunci Chuck</div>
    <p>Chuck berfungsi menjepit benda kerja pada spindel. Kunci chuck digunakan untuk mengencangkan jaw chuck,
    namun <strong>harus dilepas sepenuhnya</strong> sebelum mesin dihidupkan.</p>
    <ul class="cross">
      <li>Jangan pernah meninggalkan kunci chuck menempel di chuck — meski sebentar.</li>
      <li>Jika chuck berputar dengan kunci masih menempel, kunci akan terlempar dengan kecepatan tinggi dan sangat berbahaya.</li>

  </div>
  <div class="card">
    <div class="card-title">Penanganan Tatal / Chip</div>
    <p>Tatal (chip) adalah material yang terbuang saat penyayatan. Tatal bisa berbentuk pita panjang,
    butiran, atau serpihan tajam — dan biasanya dalam kondisi <strong>panas</strong>.</p>
    <ul class="cross">
      <li>Dilarang mengambil chip dengan tangan kosong — gunakan pinset/hook khusus.</li>

      <li>Bersihkan chip setelah mesin berhenti total dan benda kerja dingin.</li>

      <li>Jangan mengubah posisi pahat saat mesin berjalan.</li>
    </ul>
  </div>
  <div class="card">
    <div class="card-title">Pembersihan Mesin</div>
    <p>Pembersihan dilakukan setelah mesin dimatikan dan benda kerja tidak lagi berputar.</p>
    <ul class="check">
      <li>Matikan mesin, blower, dan lampu saat istirahat dan pulang.</li>
      <li>Bersihkan chip dengan kuas/panci — bukan tangan.</li>
      <li>Lap permukaan mesin agar bebas dari cairan pendingin.</li>
    </ul>
  </div>

<h2 class="h-2">Emergency Stop</h2>

  <div class="co-body">
    <div class="co-title">Kapan Wajib Tekan Emergency Stop?</div>
    <ul style="margin:8px 0 0">
      <li>Benda kerja terlepas dari chuck atau longgar saat berputar.</li>
      <li>Chip melilit pahat atau benda kerja secara berlebihan.</li>
      <li>Pahat patah atau terjadi getaran hebat.</li>
      <li>Pakaian, rambut, atau benda asing tersangkut di mesin.</li>
      <li>Seseorang terluka atau situasi tidak aman.</li>

  </div>
</div>
<p>Tombol emergency stop berwarna merah dan mudah dijangkau. Setelah ditekan, seluruh operasi mesin akan
terhenti. Tidak boleh diabaikan atau dianggap sebagai "tombol pause".</p>

<h2 class="h-2">Kartu Peringatan: Tindakan Berbahaya</h2>
<p>Berikut rangkuman tindakan berbahaya yang dilarang keras beserta konsekuensinya.

<div class="table-wrap">

    </thead>
    <tbody>

      <tr><td>Job mahasiswa dikerjakan oleh TLE/Karyawan</td><td>Penilaian tidak valid, pelanggaran integritas</td><td><span class="badge danger">10 jam + nilai −1</span></td></tr>
      <tr><td>Kunci loker hilang/terbawa pulang</td><td>Tanggung jawab shift terganggu</td><td><span class="badge danger">5 jam</span> + urus ke Finance</td></tr>
    </tbody>
  </table>
</div>

<h2 class="h-2">Keselamatan Area Kerja</h2>
<div class="grid-3">
  <div class="card">
    <div class="card-title">Lantai</div>
    <p>Jaga lantai tetap kering dan bersih dari cairan pendingin, minyak, dan chip. Area licin adalah penyebab utama jatuh di bengkel.</p>
  </div>
  <div class="card">
    <div class="card-title">Pencahayaan</div>
    <p>Pastikan pencahayaan cukup untuk membaca skala pada alat ukur dan mengamati posisi pahat. Jika kurang, laporkan ke instruktur.</p>
  </div>
  <div class="card">
    <div class="card-title">Sirkulasi</div>
    <p>Jangan menempatkan benda di lorong antar mesin. Pastikan jalur evakuasi tidak terhalang.</p>
  </div>
</div>

<div class="callout accent">

    Patuhi instruksi instruktur, gunakan APD dengan benar, dan jangan ragu untuk bertanya bila ragu.</p>
  </div>
</div>
`;

    <p>Secara umum dikenal dengan sebutan <strong>Baut / Bolt</strong>. Ulir berada di permukaan luar silinder.</p>
    <div class="figure zoomable"><img src="assets/img/ulir/ulir_image4.png" alt="Ulir luar dan dalam"></div>
  </div>
  <div class="card">
    <div class="card-title">Ulir Dalam (Internal)</div>
    <p>Biasanya disebut <strong>Mur / Nut</strong>. Ulir berada di dalam lubang silinder.</p>
    <div class="figure zoomable"><img src="assets/img/ulir/ulir_image4.png" alt="Ulir luar dan dalam"></div>
  </div>
</div>

<h2 class="h-2">5. Jenis Ulir Berdasarkan Bentuk</h2>
<div class="card">
  <div class="figure zoomable"><img src="assets/img/ulir/ulir_image5.png" alt="Bentuk profil ulir"></div>
  <div class="figure zoomable"><img src="assets/img/ulir/ulir_image6.gif" alt="Animasi bentuk ulir"></div>
</div>

<h2 class="h-2">6. Ulir Kanan &amp; Ulir Kiri</h2>
<p>Berdasarkan arah penguliran:</p>
<div class="grid-2">
  <div class="card">
    <div class="card-title">Ulir Kanan (searah jarum jam)</div>
    <p>Ulir kanan digunakan untuk mengikat benda yang <strong>statis</strong> (tidak bergerak). Saat diputar
    searah jarum jam, ulir masuk/mengencang.</p>
    <div class="figure zoomable"><img src="assets/img/ulir/ulir_image8.jpeg" alt="Ulir kanan dan kiri"></div>
  </div>
  <div class="card">
    <div class="card-title">Ulir Kiri (berlawanan jarum jam)</div>
    <p>Ulir kiri biasanya mengikat benda yang <strong>bergerak (dinamis)</strong> semacam pedal sepeda,
    gergaji, shaft motor, dan lain sebagainya — untuk mencegah lepas saat putaran kerja.</p>
  </div>
</div>

<h2 class="h-2">7. Ulir Tunggal &amp; Banyak Jalan</h2>
<p>Berdasarkan banyak jalan ulir:</p>
<div class="grid-2">
  <div class="card">
    <div class="card-title">Ulir Tunggal</div>
    <p>Pitch sama dengan lebar gang (lead). Hanya ada satu jalur ulir mengelilingi batang.</p>
    <p><strong>Pitch = Lead</strong></p>
  </div>
  <div class="card">
    <div class="card-title">Ulir Ganda / Tiga Jalan / dst.</div>
    <p>Tujuannya: dengan sedikit putaran mendapatkan pergeseran panjang. Lead = Pitch × jumlah jalan.</p>
    <div class="figure zoomable"><img src="assets/img/ulir/ulir_image9.png" alt="Ulir tunggal vs multi-start"></div>
  </div>
</div>

<h2 class="h-2">8. Ulir Metrik (M)</h2>
<div class="card">
  <p>Ulir metrik ditandai dengan kode <strong>M</strong>, dengan sudut ulir <strong>60°</strong>.</p>
  <p>Contoh kode:</p>
  <ul>
    <li><span class="kbd mono">M8 × 1,25</span></li>
    <li><span class="kbd mono">M8</span></li>
    <li><span class="kbd mono">M10</span></li>
    <li><span class="kbd mono">M24 × 1,5</span></li>
  </ul>
</div>

<h2 class="h-2">9. Ulir Whitworth (W)</h2>
<div class="card">
  <p>Ulir standar nasional Inggris, dengan sudut ulir <strong>55°</strong>, ditandai dengan kode <strong>W</strong>.
  Sangat cocok untuk pembuatan dengan cara dibubut.</p>
  <p>Contoh: <span class="kbd mono">W1/2-10</span></p>
  <ul>
    <li><strong>1/2</strong>: diameter luar (inci)</li>
    <li><strong>10</strong>: ulir per inci</li>
    <li><strong>W</strong>: kode Whitworth</li>
  </ul>
</div>

<h2 class="h-2">10. Ulir Amerika (UNC, UNF)</h2>
<div class="card">
  <p>Sudut ulir juga <strong>60°</strong>, ditunjukkan dengan jumlah ulir per inci. Jenis ini mencakup:</p>
  <ul>
    <li><strong>NC</strong> — ulir kasar (coarse)</li>
    <li><strong>NF</strong> — ulir halus (fine)</li>
    <li><strong>NEF</strong> — ulir ekstra halus (extra fine)</li>
  </ul>
  <p>Contoh: <span class="kbd mono">1/2-6NC</span></p>
  <ul>
    <li><strong>1/2</strong>: diameter luar (inci)</li>
    <li><strong>6</strong>: ulir per inci</li>
    <li><strong>NC</strong>: kode ulir kasar</li>
  </ul>
</div>

<h2 class="h-2">11. Alat untuk Membuat Ulir</h2>
<div class="grid-2">
  <div class="card">
    <div class="card-title">Snei (untuk ulir luar)</div>
    <p>Ada snei belah bulat dan snei segi enam, digunakan dengan pemegang khusus. Snei dipasang pada
    tool post mesin bubut untuk membuat ulir luar dengan cara penyayatan bertahap.</p>
    <div class="figure zoomable"><img src="assets/img/ulir/ulir_image10.jpeg" alt="Snei"></div>
  </div>
  <div class="card">
    <div class="card-title">Tap (untuk ulir dalam)</div>
    <p>Terdiri dari beberapa ukuran untuk tahap <strong>awal, lanjut, dan finishing</strong>. Tap digunakan
    untuk membuat ulir dalam pada lubang yang sudah dibor sebelumnya.</p>
    <div class="figure zoomable"><img src="assets/img/ulir/ulir_image11.jpeg" alt="Tap"></div>
  </div>
</div>
<div class="grid-2">
  <div class="card">
    <div class="card-title">Mesin Bubut</div>
    <p>Dapat membuat ulir dengan pahat ulir khusus (snei atau pahat sisipan). Menggunakan sync antara
    spindel &amp; lead screw untuk akurasi pitch.</p>
  </div>
  <div class="card">
    <div class="card-title">Alat Pendukung Lain</div>
    <ul>
      <li>Mesin frais — untuk ulir non-bubut.</li>
      <li>Bor — untuk membuat lubang awal ulir dalam.</li>
    </ul>
  </div>
</div>

<h2 class="h-2">12. Snei &amp; Tap — Detail</h2>
<div class="card">
  <div class="figure zoomable"><img src="assets/img/ulir/ulir_image12.png" alt="Snei dan tap detail"></div>
</div>

<h2 class="h-2">13. Pembuatan Ulir dengan Mesin Bubut</h2>
<ol class="steps">
  <li>Buat diameter mayor terlebih dahulu (untuk ulir luar). Contoh M10 → diameter mayor 10 mm.</li>
  <li>Buat chamfer pada ujung benda kerja agar pahat masuk mulus.</li>
  <li>Pasang pahat ulir (snei) pada tool post — tinggi pusat tepat.</li>
  <li>Set RPM rendah (ulir biasanya dibuat pada RPM rendah, ~100–200 RPM).</li>
  <li>Engage lead screw, lakukan sayat pertama tipis.</li>
  <li>Cek pitch dengan thread gauge setelah sayat pertama.</li>
  <li>Ulangi sayat bertahap hingga kedalaman ulir tercapai.</li>
  <li>Buka lead screw, periksa ulir dengan ring thread gauge (untuk ulir luar).</li>
</ol>

<h2 class="h-2">14. Alat Ukur Ulir</h2>
<div class="grid-2">
  <div class="card">
    <div class="card-title">Caliper / Micrometer</div>
    <p>Untuk mengukur diameter luar ulir (diameter mayor).</p>
  </div>
  <div class="card">
    <div class="card-title">Pengukur Kisar (Pitch Thread Gauge)</div>
    <p>Alat khusus untuk memastikan pitch ulir sesuai standar. Terdiri dari beberapa bilah dengan
    profil ulir berbagai pitch.</p>
  </div>
  <div class="card">
    <div class="card-title">Plug Thread Gauge</div>
    <p>Untuk memeriksa ulir dalam (mur). Masukkan ke lubang, harus masuk dan keluar dengan pas tanpa longgar.</p>
  </div>
  <div class="card">
    <div class="card-title">Ring Thread Gauge</div>
    <p>Untuk memeriksa ulir luar (baut). Diputar ke benda kerja — harus masuk penuh dengan tangan tanpa paksa.</p>
  </div>
</div>

<h2 class="h-2">15. Diameter Mayor &amp; Minor</h2>
<div class="callout accent">
  <div class="co-ico">${ICONS.calc}</div>
  <div class="co-body">
    <div class="co-title">Catatan Penting</div>
    <ul style="margin:8px 0 0">
      <li>Untuk membuat ulir luar, harus dibuat <strong>Diameter Mayornya</strong> terlebih dahulu.
      Diameter mayor = diameter terbesar ulir.</li>
      <li>Jika diminta <strong>M10</strong>, maka diameter mayor = <strong>10 mm</strong>.</li>
      <li>Jika diminta <strong>M24 × 1,5</strong>, diameter mayor = <strong>24 mm</strong>.</li>
      <li>Untuk membuat ulir dalam, harus dibuat <strong>Diameter Minornya</strong> terlebih dahulu
      (lihat tabel Elemen Mesin).</li>
    </ul>
  </div>
</div>

<h2 class="h-2">16. Pitch &amp; Pembacaan Kode Ulir</h2>
<p>Untuk memeriksa pitch: lihat tabel Elemen Mesin atau jika ulir khusus (misal M24×1,5), maka pitch
langsung bisa terbaca <strong>1,5 mm</strong>.</p>

<div class="sim-shell" id="threadIdentifier">
  <div class="card-title" style="margin-bottom:14px"><span class="ct-ico">${ICONS.screw}</span>Identifikasi Kode Ulir</div>
  <p>Masukkan kode ulir untuk mengidentifikasi jenis, diameter mayor, dan pitch. Contoh: <span class="kbd mono">M10</span>, <span class="kbd mono">M24x1,5</span>, <span class="kbd mono">W1/2-10</span>, <span class="kbd mono">1/2-6NC</span>.</p>
  <div class="sim-grid">
    <div class="sim-controls">
      <div class="field">
        <label for="ti-code">Kode Ulir</label>
        <input type="text" class="input mono" id="ti-code" placeholder="contoh: M10" style="font-family:var(--font-mono)">
      </div>
      <button class="btn primary" id="ti-check">Identifikasi</button>
    </div>
    <div id="ti-out"></div>
  </div>
</div>

<h2 class="h-2">Latihan Identifikasi Jenis Ulir</h2>
<p>Gunakan simulator di atas untuk berlatih. Coba kode berikut dan amati hasilnya:</p>
<ul>
  <li><span class="kbd mono">M8</span> — ulir metrik standar</li>
  <li><span class="kbd mono">M8 × 1,25</span> — ulir metrik halus</li>
  <li><span class="kbd mono">M24 × 1,5</span> — ulir metrik diameter besar pitch halus</li>
  <li><span class="kbd mono">W1/2-10</span> — ulir Whitworth</li>
  <li><span class="kbd mono">1/2-6NC</span> — ulir Amerika kasar</li>
  <li><span class="kbd mono">1/4-20UNC</span> — ulir Amerika kasar (alternatif penulisan)</li>
</ul>
`;
  }
},

// ---------- HELPERS ----------
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; };
const esc = (s) => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtNum = (n, d=2) => Number(n).toFixed(d).replace('.', ',');

function findMenu(id) {
  for (const m of MENUS) {
    if (m.id === id) return m;
    if (m.children) for (const c of m.children) if (c.id === id) return c;
  }
  return null;
}
function findParent(id) {
  for (const m of MENUS) {
    if (m.id === id) return null;
    if (m.children) for (const c of m.children) if (c.id === id) return m;
  }
  return null;
}
function flatMenus() {
  const out = [];
  for (const m of MENUS) {
    if (m.children && m.children.length) {
      for (const c of m.children) out.push({ ...c, parentTitle: m.title });
    } else {
      out.push({ ...m, parentTitle: null });
    }
  }
  return out;
}

// ---------- SIDEBAR NAV RENDER ----------
function renderSidebar() {
  const nav = $('#sidebarNav');
  nav.innerHTML = '';
  let n = 0;
  MENUS.forEach((m, mi) => {
    if (m.children && m.children.length) {
      // Group
      const group = el('div', 'nav-group');
      const item = el('button', 'nav-item has-sub');
      item.setAttribute('data-menu', m.id);
      item.innerHTML = `
        <span class="ni-icon">${m.icon ? ICONS[m.icon] || '' : ''}</span>
        <span class="ni-label">${esc(m.title)}</span>
      `;
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        // Toggle expand
        const wasExpanded = item.classList.contains('expanded');
        $$('.nav-item.has-sub').forEach(n => n.classList.remove('expanded'));
        if (!wasExpanded) {
          item.classList.add('expanded');
          // Navigate to first child if collapsing sidebar on mobile
          if (window.innerWidth <= 1024) {
            // expand only
          } else {
            // on desktop, expand and go to first child
            navigate(m.children[0].id);
          }
        }
      });
      group.appendChild(item);
      const sub = el('div', 'nav-sub');
      m.children.forEach((c, ci) => {
        n++;
        const subItem = el('button', 'nav-item');
        subItem.setAttribute('data-menu', c.id);
        if (State.visited.includes(c.id)) subItem.classList.add('visited');
        if (State.completed.includes(c.id)) subItem.classList.add('completed');
        subItem.innerHTML = `
          <span class="ni-icon">${c.icon ? ICONS[c.icon] || '' : ''}</span>
          <span class="ni-label">${esc(c.title)}</span>
          <span class="ni-badge">${String(n).padStart(2,'0')}</span>
        `;
        subItem.addEventListener('click', (e) => {
          e.stopPropagation();
          navigate(c.id);
        });
        sub.appendChild(subItem);
      });
      group.appendChild(sub);
      nav.appendChild(group);
    } else {
      n++;
      const group = el('div', 'nav-group');
      const item = el('button', 'nav-item');
      item.setAttribute('data-menu', m.id);
      if (State.visited.includes(m.id)) item.classList.add('visited');
      if (State.completed.includes(m.id)) item.classList.add('completed');
      item.innerHTML = `
        <span class="ni-icon">${m.icon ? ICONS[m.icon] || '' : ''}</span>
        <span class="ni-label">${esc(m.title)}</span>
        <span class="ni-badge">${String(n).padStart(2,'0')}</span>
      `;
      item.addEventListener('click', () => navigate(m.id));
      group.appendChild(item);
      nav.appendChild(group);
    }
  });
  // Update select
  const sel = $('#materialSelect');
  sel.innerHTML = '';
  flatMenus().forEach((m, i) => {
    const o = el('option', null, `${String(i+1).padStart(2,'0')} — ${m.parentTitle ? m.parentTitle+': ' : ''}${m.title}`);
    o.value = m.id;
    sel.appendChild(o);
  });
}

function updateSidebarActive() {
  $$('.nav-item').forEach(n => {
    n.classList.toggle('active', n.getAttribute('data-menu') === State.currentMenuId);
    if (n.classList.contains('has-sub') && n.classList.contains('active')) {
      n.classList.add('expanded');
    }
    // Auto-expand parent of active
    const parent = findParent(State.currentMenuId);
    if (parent && n.getAttribute('data-menu') === parent.id) {
      n.classList.add('expanded');
    }
  });
  // Mark visited
  $$('.nav-item[data-menu]').forEach(n => {
    const id = n.getAttribute('data-menu');
    if (State.visited.includes(id)) n.classList.add('visited');
    if (State.completed.includes(id)) n.classList.add('completed');
  });
  // Update select
  const sel = $('#materialSelect');
  if (sel.value !== State.currentMenuId) sel.value = State.currentMenuId;
}


// Embedded interactive 3D lathe. Preview hides controls and loops through all nine stages;
// full-screen uses the uploaded HTML unchanged and exposes all original controls.
let cachedTurning3DHtml = null;
function getTurning3DHtml() {
  if (cachedTurning3DHtml !== null) return cachedTurning3DHtml;
  const source = document.getElementById('turning3dEmbeddedSource');
  if (!source) return '';
  const bytes = Uint8Array.from(atob(source.textContent.trim()), character => character.charCodeAt(0));
  cachedTurning3DHtml = new TextDecoder('utf-8').decode(bytes);
  return cachedTurning3DHtml;
}
function makeTurning3DPreviewHtml() {
  const html = getTurning3DHtml();
  const previewStyles = `<style id="home-embed-preview">
    html, body { background:#e8f0f8!important; }
    .hud.top, .hud.bottom, .hint, #mobileNote, #boreInset { display:none!important; }
    #stage3d { cursor:grab!important; }
    #stage3d:active { cursor:grabbing!important; }
  </style>`;
  return html.replace('</head>', previewStyles + '\n</head>');
}
function mountTurning3DPreview() {
  const preview = document.getElementById('turning3dPreview');
  if (!preview) return;
  const loading = document.getElementById('turning3dLoading');
  if (loading) {
    loading.classList.remove('is-ready');
    loading.querySelector('.hero-3d-loading-text').textContent = 'Memuat simulasi bubut 3D…';
    setTimeout(() => {
      if (loading.isConnected && !loading.classList.contains('is-ready')) {
        loading.querySelector('.hero-3d-loading-text').textContent = 'Simulasi 3D memerlukan koneksi internet untuk memuat Three.js.';
        const spinner = loading.querySelector('.hero-3d-spinner');
        if (spinner) spinner.style.animationPlayState = 'paused';
      }
    }, 10000);
  }
  try { preview.srcdoc = makeTurning3DPreviewHtml(); }
  catch (error) { console.error('Gagal menampilkan simulasi Turning 3D:', error); }
}
window.addEventListener('message', event => {
  const preview = document.getElementById('turning3dPreview');
  if (!preview || event.source !== preview.contentWindow) return;
  if (event.data && event.data.type === 'ATMI_TURNING_3D_READY') {
    const loading = document.getElementById('turning3dLoading');
    if (loading) loading.classList.add('is-ready');
  }
  if (event.data && event.data.type === 'ATMI_TURNING_3D_STAGE') {
    const label = document.getElementById('turning3dStage');
    const stage = Number(event.data.stage);
    if (label && Number.isInteger(stage) && stage >= 1 && stage <= 9) {
      const titles = ['Facing', 'Bubut Diameter', 'Chamfer', 'Undercut', 'Ulir M36×4', 'Drilling', 'Chamfer Lubang', 'Ulir Dalam', 'Knurling'];
      label.textContent = String(stage).padStart(2, '0') + ' / 09 · ' + titles[stage - 1];
    }
  }
});
function openTurning3DFull() {
  const modal = document.getElementById('turning3dModal');
  const frame = document.getElementById('turning3dFullFrame');
  if (!modal || !frame || !modal.hidden) return;
  // Stop preview GPU workload while full simulation is displayed.
  const preview = document.getElementById('turning3dPreview');
  if (preview) preview.removeAttribute('srcdoc');
  modal.hidden = false;
  frame.srcdoc = getTurning3DHtml();
  modal.querySelector('.turning-3d-close').focus();
}
function closeTurning3DFull() {
  const modal = document.getElementById('turning3dModal');
  const frame = document.getElementById('turning3dFullFrame');
  if (!modal || modal.hidden) return;
  frame.removeAttribute('srcdoc');
  modal.hidden = true;
  mountTurning3DPreview();
  const expandButton = document.querySelector('.hero-3d-expand');
  if (expandButton) expandButton.focus();
}
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') closeTurning3DFull();
});

// ---------- RENDER CONTENT ----------
function renderContent() {
  const menu = findMenu(State.currentMenuId);
  const pane = $('#contentPane');
  const scroll = $('#contentScroll');
  if (!menu) {
    pane.innerHTML = '<div class="card"><p>Materi tidak ditemukan.</p></div>';
    return;
  }
  const parent = findParent(menu.id);
  const crumb = $('#crumb');
  if (parent) {
    crumb.innerHTML = `<span>${esc(parent.title)}</span><span class="sep">/</span><span class="cur">${esc(menu.title)}</span>`;
  } else {
    crumb.innerHTML = `<span class="cur">${esc(menu.title)}</span>`;
  }
  const flat = flatMenus();
  const idx = flat.findIndex(m => m.id === menu.id);
  $('#menuNum').textContent = String(idx + 1).padStart(2, '0');

  // Render content (menu.content is a function returning HTML string)
  const html = typeof menu.content === 'function' ? menu.content() : (menu.content || '<p>Materi sedang disiapkan.</p>');
  pane.innerHTML = html;
  if (menu.id === 'beranda') mountTurning3DPreview();
  // Reset scroll position
  scroll.scrollTop = 0;
  // Mark visited
  if (!State.visited.includes(menu.id)) {
    State.visited.push(menu.id);
    localStorage.setItem('atmi-lw-visited', JSON.stringify(State.visited));
  }
  updateSidebarActive();
  updateProgressRing();
  updateNavButtons();
  // Bind interactive components in this pane
  bindPaneInteractions(pane);
  // Add "mark complete" button at the end
  if (menu.id !== 'beranda') {
    appendCompleteButton(pane, menu.id);
  }
}

function appendCompleteButton(pane, menuId) {
  const isDone = State.completed.includes(menuId);
  const foot = el('div', 'content-foot');
  foot.innerHTML = `
    <button class="btn ${isDone ? 'primary' : 'ghost'}" id="markCompleteBtn">
      ${ICONS.check}
      ${isDone ? 'Selesai dipelajari' : 'Tandai sudah dipelajari'}
    </button>
    <div class="foot-nav">
      <button class="btn ghost" id="footPrev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg> Sebelumnya</button>
      <button class="btn primary" id="footNext">Berikutnya <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
  `;
  pane.appendChild(foot);
  $('#markCompleteBtn', pane).addEventListener('click', () => {
    const i = State.completed.indexOf(menuId);
    if (i === -1) State.completed.push(menuId);
    else State.completed.splice(i, 1);
    localStorage.setItem('atmi-lw-completed', JSON.stringify(State.completed));
    renderContent();
    updateSidebarActive();
  });
  $('#footPrev', pane).addEventListener('click', prevMenu);
  $('#footNext', pane).addEventListener('click', nextMenu);
}

function updateNavButtons() {
  const flat = flatMenus();
  const idx = flat.findIndex(m => m.id === State.currentMenuId);
  $('#prevBtn').disabled = idx <= 0;
  $('#nextBtn').disabled = idx >= flat.length - 1;
}

function updateProgressRing() {
  const flat = flatMenus().filter(m => m.id !== 'beranda');
  const done = flat.filter(m => State.completed.includes(m.id)).length;
  const pct = Math.round((done / flat.length) * 100);
  const c = 2 * Math.PI * 9;
  $('#ringFg').setAttribute('stroke-dashoffset', String(c - (c * pct / 100)));
  $('#ringPct').textContent = pct + '%';
}

// ---------- NAVIGATION ----------
function navigate(menuId, opts={}) {
  if (!findMenu(menuId)) return;
  State.currentMenuId = menuId;
  renderContent();
  // Close mobile sidebar
  if (window.innerWidth <= 1024) {
    $('#app').setAttribute('data-sidebar', 'closed');
  }
}
function nextMenu() {
  const flat = flatMenus();
  const idx = flat.findIndex(m => m.id === State.currentMenuId);
  if (idx < flat.length - 1) navigate(flat[idx + 1].id);
}
function prevMenu() {
  const flat = flatMenus();
