// ---------- PANE INTERACTIONS ----------
function bindPaneInteractions(pane) {
  // Accordion
  $$('.acc-head', pane).forEach(h => {
    h.addEventListener('click', () => {
      const item = h.closest('.acc-item');
      item.classList.toggle('open');
    });
  });

  // Lightbox triggers — figures + tiles + gallery cards
  const lbTriggers = $$('.figure.zoomable img, .img-tile img, .gallery-card .gc-img img', pane);
  lbTriggers.forEach((img, i) => {
    img.addEventListener('click', (e) => {
      e.stopPropagation();
      // Collect all images in the same parent gallery/grid/figure-group
      let gallery = [];
      let parent = img.closest('.gallery-grid, .img-grid, .content-pane');
      if (parent) {
        gallery = $$('img', parent).filter(x => x.closest('.gallery-card, .img-tile, .figure') && !x.hidden);
      }
      const idx = gallery.indexOf(img);
      openLightbox(gallery.length ? gallery : [img], idx >= 0 ? idx : 0);
    });
  });

  // Tabs
  $$('[data-tab-group]', pane).forEach(group => {
    const tabs = $$('[data-tab]', group);
    tabs.forEach(t => {
      t.addEventListener('click', () => {
        const target = t.getAttribute('data-tab');
        tabs.forEach(x => x.classList.toggle('active', x === t));
        $$('[data-tab-panel]', group).forEach(p => {
          p.classList.toggle('hidden', p.getAttribute('data-tab-panel') !== target);
        });
      });
    });
  });

  // Foto instruktur diambil langsung dari assets/img/ pada GitHub.
  if ($('#instructorProfiles', pane)) bindStaticInstructorPhotos(pane);

  // Specific simulator hooks
  if ($('#dialCaliperSim', pane)) bindDialCaliperSim(pane);
  if ($('#outsideMicSim', pane)) bindOutsideMicSim(pane);
  if ($('#insideMicSim', pane)) bindInsideMicSim(pane);
  if ($('#nilaiSim', pane)) bindNilaiSim(pane);
  if ($('[data-quiz]', pane)) bindQuiz(pane);
  if ($('#threadIdentifier', pane)) bindThreadIdentifier(pane);
  if ($('#galleryFilter', pane)) bindGalleryFilter(pane);
  if ($('#threadComparison', pane)) bindThreadComparison(pane);
  bindStaticAssetImages(pane);
}


/* ===========================================================
   GAMBAR LOKAL: GitHub Pages /assets/ (tanpa penyimpanan online)
   - Nama file dan ekstensi harus identik dengan yang ada pada src.
   - Gambar materi/tabel tetap dapat diklik untuk zoom (lightbox).
   - Jika gambar belum tersedia, tampilkan lokasi file yang harus diupload.
   =========================================================== */
function bindStaticInstructorPhotos(pane) {
  pane.querySelectorAll('.instructor-photo').forEach(button => {
    const img = button.querySelector('.instructor-photo-img');
    if (!img) return;
    button.addEventListener('click', () => {
      if (!img.hidden && img.complete && img.naturalWidth > 0) openLightbox([img],0);
    });
  });
}
function bindStaticAssetImages(pane) {
  pane.querySelectorAll('img[src^="assets/"]:not(.instructor-photo-img)').forEach(img => {
    const src = img.getAttribute('src') || '';
    if (/tabel|toleransi|kehalusan|penilaian|tahapan|gambar kerja|work preparation|form |bobot/i.test(img.alt || '')) {
      if (img.closest('.figure')) img.classList.add('asset-document');
    }
    const onMissing = () => {
      if (!img.isConnected || img.dataset.assetMissing === 'true') return;
      img.dataset.assetMissing = 'true';
      img.hidden = true;
      const box = document.createElement('div');
      box.className = 'asset-missing';
      const heading = document.createElement('strong');
      heading.textContent = 'Gambar belum tersedia';
      const path = document.createElement('span');
      path.textContent = 'Upload ke GitHub: ' + src;
      box.append(heading,path);
      img.insertAdjacentElement('afterend',box);
    };
    img.addEventListener('error', onMissing);
    if (img.complete && img.naturalWidth === 0) onMissing();
  });
}

// ---------- LIGHTBOX ----------
let LB_STATE = { imgs: [], idx: 0, scale: 1 };
function openLightbox(imgs, idx=0) {
  LB_STATE.imgs = imgs;
  LB_STATE.idx = idx;
  LB_STATE.scale = 1;
  renderLightbox();
  $('#lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  $('#lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
function renderLightbox() {
  const img = LB_STATE.imgs[LB_STATE.idx];
  if (!img) return;
  const src = img.src || img.getAttribute('data-full') || '';
  const alt = img.alt || '';
  const cap = img.closest('.gallery-card, .img-tile, .figure');
  const capText = cap ? (cap.querySelector('.gc-title, .it-cap, .fig-cap')?.textContent || '') : '';
  $('#lbImage').src = src;
  $('#lbImage').alt = alt;
  $('#lbImage').style.transform = `scale(${LB_STATE.scale})`;
  $('#lbCap').textContent = capText;
}
function lbNext() {
  LB_STATE.idx = (LB_STATE.idx + 1) % LB_STATE.imgs.length;
  LB_STATE.scale = 1;
  renderLightbox();
}
function lbPrev() {
  LB_STATE.idx = (LB_STATE.idx - 1 + LB_STATE.imgs.length) % LB_STATE.imgs.length;
  LB_STATE.scale = 1;
  renderLightbox();
}
function lbZoom(delta) {
  LB_STATE.scale = Math.min(4, Math.max(0.5, LB_STATE.scale + delta));
  $('#lbImage').style.transform = `scale(${LB_STATE.scale})`;
}

// ---------- SEARCH ----------
function performSearch(q) {
  q = q.trim().toLowerCase();
  const results = $('#searchResults');
  if (!q) { results.classList.remove('open'); results.innerHTML=''; return; }
  const matches = [];
  for (const m of flatMenus()) {
    const text = (m.title + ' ' + (m.searchableText || '') + ' ' + (typeof m.content === 'function' ? m.content().replace(/<[^>]+>/g, ' ') : (m.content || '').replace(/<[^>]+>/g,' '))).toLowerCase();
    if (text.includes(q)) matches.push({ menu: m, score: m.title.toLowerCase().includes(q) ? 2 : 1 });
  }
  // Glosarium
  for (const g of GLOSARIUM) {
    if ((g.term + ' ' + g.def).toLowerCase().includes(q)) {
      matches.push({ glossary: g, score: 1 });
    }
  }
  matches.sort((a,b) => b.score - a.score);
  if (!matches.length) {
    results.innerHTML = '<div class="search-empty">Tidak ada hasil. Coba kata kunci lain.</div>';
  } else {
    results.innerHTML = matches.slice(0, 12).map(m => {
      if (m.menu) {
        const title = m.menu.title;
        const sub = m.menu.parentTitle ? `${m.menu.parentTitle} › ${m.menu.title}` : 'Materi';
        return `<a class="search-result-item" data-menu="${esc(m.menu.id)}">
          <div class="sr-title">${highlight(title, q)}</div>
          <div class="sr-sub">${esc(sub)}</div>
        </a>`;
      } else {
        return `<a class="search-result-item" data-glossary="${esc(m.glossary.term)}">
          <div class="sr-title">${highlight(m.glossary.term, q)} <span class="badge muted">Glosarium</span></div>
          <div class="sr-sub">${highlight(m.glossary.def.slice(0,90), q)}…</div>
        </a>`;
      }
    }).join('');
    $$('.search-result-item', results).forEach(it => {
      it.addEventListener('click', () => {
        const menuId = it.getAttribute('data-menu');
        const glossTerm = it.getAttribute('data-glossary');
        if (menuId) { navigate(menuId); results.classList.remove('open'); $('#globalSearch').value=''; }
        else if (glossTerm) { openGlossary(); setTimeout(() => { $('#glossarySearch').value = glossTerm; filterGlossary(); }, 100); results.classList.remove('open'); $('#globalSearch').value=''; }
      });
    });
  }
  results.classList.add('open');
}
function highlight(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return esc(text).replace(re, '<mark>$1</mark>');
}

// ---------- GLOSARIUM ----------
function openGlossary() {
  $('#glossaryModal').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderGlossary('');
}
function closeGlossary() {
  $('#glossaryModal').classList.remove('open');
  document.body.style.overflow = '';
}
function renderGlossary(filter='') {
  const grid = $('#glossaryGrid');
  const f = filter.trim().toLowerCase();
  const items = GLOSARIUM.filter(g => !f || (g.term + ' ' + g.def).toLowerCase().includes(f));
  if (!items.length) {
    grid.innerHTML = '<div class="search-empty">Istilah tidak ditemukan.</div>';
    return;
  }
  grid.innerHTML = items.map(g => `
    <div class="glos-item">
      <div class="gt-term">${esc(g.term)}</div>
      <div class="gt-def">${esc(g.def)}</div>
    </div>
  `).join('');
}
function filterGlossary() {
  renderGlossary($('#glossarySearch').value);
}

/* ===========================================================
   SIMULATOR 1: DIAL CALIPER
   Skala utama: 1 mm per garis; Dial: 0,01 mm per garis (range 100 garis = 1 mm)
   Pembacaan = skala utama (mm) + dial (0,01 mm)
   =========================================================== */
function buildDialCaliperSVG(mm, dial) {
  // mm: posisi pada skala utama (bisa desimal); dial: posisi jarum dial (0-99)
  // Tampilkan skala utama 0..30 mm dengan pointer di posisi mm
  const W = 460, H = 280;
  const x0 = 30, x1 = W - 20;
  const yScale = 90;
  const total = 30; // 30 mm visible
  const px_per_mm = (x1 - x0) / total;
  // Build scale marks
  let marks = '';
  for (let i = 0; i <= total; i++) {
    const x = x0 + i * px_per_mm;
    const h = i % 5 === 0 ? 18 : 10;
    marks += `<line x1="${x}" y1="${yScale}" x2="${x}" y2="${yScale + h}" stroke="var(--c-text-2)" stroke-width="${i % 5 === 0 ? 1.4 : 0.8}"/>`;
    if (i % 5 === 0) marks += `<text class="scale-text" x="${x}" y="${yScale - 4}" text-anchor="middle">${i}</text>`;
  }
  // Pointer (jaw position) at mm
  const ptrX = x0 + mm * px_per_mm;
  const jaw = `
    <line x1="${ptrX}" y1="${yScale - 6}" x2="${ptrX}" y2="${yScale + 30}" stroke="var(--c-accent)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="${ptrX-6},${yScale+30} ${ptrX+6},${yScale+30} ${ptrX},${yScale+38}" fill="var(--c-accent)"/>
  `;
  // Dial circle on right
  const cx = W - 90, cy = 200, r = 60;
  let dialMarks = '';
  for (let i = 0; i < 50; i++) {
    const ang = (i / 50) * Math.PI * 2 - Math.PI/2;
    const x1 = cx + Math.cos(ang) * r;
    const y1 = cy + Math.sin(ang) * r;
    const len = i % 5 === 0 ? 9 : 5;
    const x2 = cx + Math.cos(ang) * (r - len);
    const y2 = cy + Math.sin(ang) * (r - len);
    dialMarks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--c-text-2)" stroke-width="${i % 5 === 0 ? 1.3 : 0.7}"/>`;
    if (i % 5 === 0) {
      const tx = cx + Math.cos(ang) * (r - 18);
      const ty = cy + Math.sin(ang) * (r - 18);
      dialMarks += `<text class="scale-text" x="${tx}" y="${ty+3}" text-anchor="middle" font-size="10">${i}</text>`;
    }
  }
  // Needle
  const ang = (dial / 50) * Math.PI * 2 - Math.PI/2;
  const nx = cx + Math.cos(ang) * (r - 8);
  const ny = cy + Math.sin(ang) * (r - 8);
  const needle = `<line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="var(--c-accent-2)" stroke-width="2.5" stroke-linecap="round"/>`;
  return `
    <svg class="dial-caliper-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Simulasi Dial Caliper">
      <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
      <!-- main bar -->
      <rect x="${x0-12}" y="${yScale-2}" width="${x1-x0+24}" height="6" fill="var(--c-border)" rx="2"/>
      <!-- scale marks -->
      ${marks}
      <!-- jaw/pointer -->
      ${jaw}
      <!-- dial -->
      <circle cx="${cx}" cy="${cy}" r="${r+4}" fill="var(--c-surface-2)" stroke="var(--c-border-hi)" stroke-width="1.5"/>
      ${dialMarks}
      ${needle}
      <circle cx="${cx}" cy="${cy}" r="4" fill="var(--c-accent-2)"/>
      <text class="scale-text" x="${cx}" y="${cy + r + 22}" text-anchor="middle" fill="var(--c-text-3)">DIAL · 0,01 mm</text>
      <!-- main scale label -->
      <text class="scale-text" x="${(x0+x1)/2}" y="${yScale + 56}" text-anchor="middle" fill="var(--c-text-3)">SKALA UTAMA · mm</text>
    </svg>
  `;
}
function bindDialCaliperSim(pane) {
  const root = $('#dialCaliperSim', pane);
  if (!root) return;
  const mmEl = $('#dc-mm', root);
  const dialEl = $('#dc-dial', root);
  const canvas = $('#dc-canvas', root);
  const readout = $('#dc-readout', root);
  const subRead = $('#dc-sub', root);
  const randomBtn = $('#dc-random', root);
  const resetBtn = $('#dc-reset', root);
  const checkBtn = $('#dc-check', root);
  const answerEl = $('#dc-answer', root);
  const modeRadios = $$('input[name="dc-mode"]', root);

  let mode = 'explore'; // explore | practice
  modeRadios.forEach(r => r.addEventListener('change', () => {
    mode = r.value;
    if (mode === 'practice') {
      randomBtn.click();
      readout.textContent = '?,??';
      subRead.textContent = 'Latihan: baca ukurannya!';
    } else {
      draw();
    }
  }));

  function getMM() { return parseFloat(mmEl.value); }
  function getDial() { return parseInt(dialEl.value); }
  function draw() {
    const mm = getMM();
    const dial = getDial();
    canvas.innerHTML = buildDialCaliperSVG(mm, dial);
    // Readout: mm + dial*0.01
    const total = mm + dial * 0.01;
    if (mode === 'explore') {
      readout.textContent = fmtNum(total, 2);
      subRead.textContent = `Skala utama ${fmtNum(mm,1)} mm + Dial ${dial}×0,01 = ${fmtNum(total,2)} mm`;
    } else {
      readout.textContent = '?,??';
      subRead.textContent = 'Mode latihan: tentukan sendiri!';
    }
  }
  mmEl.addEventListener('input', draw);
  dialEl.addEventListener('input', draw);
  randomBtn.addEventListener('click', () => {
    const mm = Math.floor(Math.random() * 25) + 1;
    const dial = Math.floor(Math.random() * 50);
    mmEl.value = mm;
    dialEl.value = dial;
    draw();
    if (mode === 'practice') {
      readout.textContent = '?,??';
      subRead.textContent = 'Latihan: baca ukurannya, lalu klik "Periksa Jawaban".';
      answerEl.innerHTML = '';
    }
  });
  resetBtn.addEventListener('click', () => {
    mmEl.value = 5;
    dialEl.value = 0;
    draw();
  });
  checkBtn.addEventListener('click', () => {
    const mm = getMM();
    const dial = getDial();
    const total = mm + dial * 0.01;
    const userAns = parseFloat(($('#dc-user', root).value || '').replace(',', '.'));
    if (isNaN(userAns)) {
      answerEl.innerHTML = `<div class="callout warning"><div class="co-ico">!</div><div class="co-body"><div class="co-title">Masukkan jawaban</div><p>Silakan masukkan angka pada kolom jawaban terlebih dahulu.</p></div></div>`;
      return;
    }
    const correct = Math.abs(userAns - total) < 0.02;
    answerEl.innerHTML = `<div class="callout ${correct ? 'success' : 'danger'}">
      <div class="co-ico">${correct ? '✓' : '✕'}</div>
      <div class="co-body">
        <div class="co-title">${correct ? 'Tepat!' : 'Belum tepat'}</div>
        <p>Jawaban Anda: <strong>${fmtNum(userAns,2)} mm</strong> · Jawaban benar: <strong>${fmtNum(total,2)} mm</strong>.</p>
        <p>Skala utama ${fmtNum(mm,1)} mm + Dial ${dial} × 0,01 mm = ${fmtNum(total,2)} mm.</p>
      </div>
    </div>`;
  });
  draw();
}

/* ===========================================================
   SIMULATOR 2: OUTSIDE MICROMETER
   Skala utama atas & bawah bergantian 0,5 mm; thimble 0..49 → 0,01 mm
   Pembacaan = skala utama (mm) + thimble × 0,01
   Aturan: putar kanan → ukuran lebih kecil; kiri → lebih besar
   =========================================================== */
function buildOutsideMicrometerSVG(mainMM, thimble) {
  const W = 460, H = 280;
  const x0 = 30, x1 = W - 90;
  const yScale = 70;
  // Visible: 25 mm, top scale 0,1,2,...25; bottom 0.5,1.5,2.5,...
  const total = 25;
  const px = (x1 - x0) / total;
  let marks = '';
  for (let i = 0; i <= total; i++) {
    const x = x0 + i * px;
    // top mark (mm)
    marks += `<line x1="${x}" y1="${yScale}" x2="${x}" y2="${yScale + 16}" stroke="var(--c-text-2)" stroke-width="1.2"/>`;
    marks += `<text class="scale-text" x="${x}" y="${yScale - 4}" text-anchor="middle" font-size="10">${i}</text>`;
    // bottom mark (mm + 0.5)
    if (i < total) {
      const xh = x + px/2;
      marks += `<line x1="${xh}" y1="${yScale + 22}" x2="${xh}" y2="${yScale + 36}" stroke="var(--c-text-2)" stroke-width="0.9"/>`;
    }
  }
  marks += `<line x1="${x0}" y1="${yScale + 22}" x2="${x1}" y2="${yScale + 22}" stroke="var(--c-border)" stroke-width="1"/>`;
  marks += `<text class="scale-text" x="${(x0+x1)/2}" y="${yScale - 18}" text-anchor="middle" fill="var(--c-text-3)" font-size="10">SKALA ATAS · mm</text>`;
  marks += `<text class="scale-text" x="${(x0+x1)/2}" y="${yScale + 50}" text-anchor="middle" fill="var(--c-text-3)" font-size="10">SKALA BAWAH · 0,5 mm</text>`;
  // Datum line / pointer (horizontal reference)
  const ptrX = x0 + mainMM * px;
  marks += `<line x1="${x0-6}" y1="${yScale + 19}" x2="${x1+6}" y2="${yScale + 19}" stroke="var(--c-accent)" stroke-width="1.2" stroke-dasharray="3 2" opacity=".6"/>`;
  marks += `<line x1="${ptrX}" y1="${yScale - 8}" x2="${ptrX}" y2="${yScale + 42}" stroke="var(--c-accent)" stroke-width="2.5" stroke-linecap="round"/>`;

  // Thimble — circular scale 0..49
  const cx = W - 80, cy = 200, r = 56;
  let thMarks = '';
  for (let i = 0; i < 50; i++) {
    const a = (i / 50) * Math.PI * 2 - Math.PI/2;
    const x1 = cx + Math.cos(a) * r;
    const y1 = cy + Math.sin(a) * r;
    const len = i % 5 === 0 ? 9 : 5;
    const x2 = cx + Math.cos(a) * (r - len);
    const y2 = cy + Math.sin(a) * (r - len);
    thMarks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--c-text-2)" stroke-width="${i % 5 === 0 ? 1.3 : 0.7}"/>`;
    if (i % 5 === 0) {
      const tx = cx + Math.cos(a) * (r - 17);
      const ty = cy + Math.sin(a) * (r - 17);
      thMarks += `<text class="scale-text" x="${tx}" y="${ty+3}" text-anchor="middle" font-size="9">${i}</text>`;
    }
  }
  // Needle on thimble
  const ang = (thimble / 50) * Math.PI * 2 - Math.PI/2;
  const nx = cx + Math.cos(ang) * (r - 6);
  const ny = cy + Math.sin(ang) * (r - 6);
  const needle = `<line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="var(--c-accent-2)" stroke-width="2.4" stroke-linecap="round"/>`;

  return `
    <svg class="micrometer-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Simulasi Outside Micrometer">
      ${marks}
      <circle cx="${cx}" cy="${cy}" r="${r+4}" fill="var(--c-surface-2)" stroke="var(--c-border-hi)" stroke-width="1.5"/>
      ${thMarks}
      ${needle}
      <circle cx="${cx}" cy="${cy}" r="4" fill="var(--c-accent-2)"/>
      <text class="scale-text" x="${cx}" y="${cy + r + 22}" text-anchor="middle" fill="var(--c-text-3)" font-size="10">THIMBLE · 0,01 mm</text>
    </svg>
  `;
}
function bindOutsideMicSim(pane) {
  const root = $('#outsideMicSim', pane);
  if (!root) return;
  const mainEl = $('#om-main', root);
  const thimbleEl = $('#om-thimble', root);
  const canvas = $('#om-canvas', root);
  const readout = $('#om-readout', root);
  const subRead = $('#om-sub', root);
  const randomBtn = $('#om-random', root);
  const resetBtn = $('#om-reset', root);
  const checkBtn = $('#om-check', root);
  const answerEl = $('#om-answer', root);
  const modeRadios = $$('input[name="om-mode"]', root);

  let mode = 'explore';
  modeRadios.forEach(r => r.addEventListener('change', () => {
    mode = r.value;
    if (mode === 'practice') { randomBtn.click(); } else { draw(); }
  }));

  function getMain() { return parseFloat(mainEl.value); } // 0..25 in 0.5 steps
  function getThimble() { return parseInt(thimbleEl.value); } // 0..49
  function total() {
    const main = getMain();
    const thimble = getThimble();
    return main + thimble * 0.01;
  }
  function draw() {
    const main = getMain();
    const thimble = getThimble();
    canvas.innerHTML = buildOutsideMicrometerSVG(main, thimble);
    const t = total();
    if (mode === 'explore') {
      readout.textContent = fmtNum(t, 2);
      const half = main % 1 > 0.4; // 0.5 visible?
      subRead.textContent = `Skala utama ${fmtNum(main,1)} mm + Thimble ${thimble} × 0,01 = ${fmtNum(t,2)} mm`;
    } else {
      readout.textContent = '?,??';
      subRead.textContent = 'Mode latihan: tentukan sendiri!';
    }
  }
  mainEl.addEventListener('input', draw);
  thimbleEl.addEventListener('input', draw);
  randomBtn.addEventListener('click', () => {
    const main = (Math.floor(Math.random() * 24) + 1) * 0.5 + (Math.random() < 0.5 ? 0 : 0.5);
    mainEl.value = main.toFixed(1);
    thimbleEl.value = Math.floor(Math.random() * 50);
    draw();
    if (mode === 'practice') {
      readout.textContent = '?,??';
      subRead.textContent = 'Latihan: baca ukurannya, lalu klik "Periksa Jawaban".';
      answerEl.innerHTML = '';
    }
  });
  resetBtn.addEventListener('click', () => {
    mainEl.value = 5.0;
    thimbleEl.value = 0;
    draw();
  });
  checkBtn.addEventListener('click', () => {
    const t = total();
    const userAns = parseFloat(($('#om-user', root).value || '').replace(',', '.'));
    if (isNaN(userAns)) {
      answerEl.innerHTML = `<div class="callout warning"><div class="co-ico">!</div><div class="co-body"><div class="co-title">Masukkan jawaban</div><p>Silakan masukkan angka pada kolom jawaban terlebih dahulu.</p></div></div>`;
      return;
    }
    const correct = Math.abs(userAns - t) < 0.02;
    answerEl.innerHTML = `<div class="callout ${correct ? 'success' : 'danger'}">
      <div class="co-ico">${correct ? '✓' : '✕'}</div>
      <div class="co-body">
        <div class="co-title">${correct ? 'Tepat!' : 'Belum tepat'}</div>
        <p>Jawaban Anda: <strong>${fmtNum(userAns,2)} mm</strong> · Jawaban benar: <strong>${fmtNum(t,2)} mm</strong>.</p>
        <p>Skala utama ${fmtNum(getMain(),1)} mm + Thimble ${getThimble()} × 0,01 mm = ${fmtNum(t,2)} mm.</p>
      </div>
    </div>`;
  });
  draw();
}

/* ===========================================================
   SIMULATOR 3: INSIDE MICROMETER
   Same as outside mic BUT reversed direction:
   Clockwise (right) → ukuran LEBIH BESAR
   Counterclockwise (left) → ukuran LEBIH KECIL
   =========================================================== */
function bindInsideMicSim(pane) {
  const root = $('#insideMicSim', pane);
  if (!root) return;
  const mainEl = $('#im-main', root);
  const thimbleEl = $('#im-thimble', root);
  const canvas = $('#im-canvas', root);
  const readout = $('#im-readout', root);
  const subRead = $('#im-sub', root);
  const randomBtn = $('#im-random', root);
  const resetBtn = $('#im-reset', root);
  const checkBtn = $('#im-check', root);
  const answerEl = $('#im-answer', root);
  const modeRadios = $$('input[name="im-mode"]', root);

  let mode = 'explore';
  modeRadios.forEach(r => r.addEventListener('change', () => {
    mode = r.value;
    if (mode === 'practice') { randomBtn.click(); } else { draw(); }
  }));

  function getMain() { return parseFloat(mainEl.value); }
  function getThimble() { return parseInt(thimbleEl.value); }
  function total() {
    return getMain() + getThimble() * 0.01;
  }
  function draw() {
    canvas.innerHTML = buildOutsideMicrometerSVG(getMain(), getThimble()); // reuse same SVG; rule difference noted in text
    const t = total();
    if (mode === 'explore') {
      readout.textContent = fmtNum(t, 2);
      subRead.textContent = `Skala utama ${fmtNum(getMain(),1)} mm + Thimble ${getThimble()} × 0,01 = ${fmtNum(t,2)} mm (arah putar KEBALIKAN outside mic)`;
    } else {
      readout.textContent = '?,??';
      subRead.textContent = 'Mode latihan: tentukan sendiri!';
    }
  }
  mainEl.addEventListener('input', draw);
  thimbleEl.addEventListener('input', draw);
  randomBtn.addEventListener('click', () => {
    mainEl.value = ((Math.floor(Math.random()*24)+1)*0.5).toFixed(1);
    thimbleEl.value = Math.floor(Math.random()*50);
    draw();
    if (mode === 'practice') {
      readout.textContent = '?,??';
      answerEl.innerHTML = '';
    }
  });
  resetBtn.addEventListener('click', () => { mainEl.value = 12.0; thimbleEl.value = 0; draw(); });
  checkBtn.addEventListener('click', () => {
    const t = total();
    const userAns = parseFloat(($('#im-user', root).value || '').replace(',', '.'));
    if (isNaN(userAns)) {
      answerEl.innerHTML = `<div class="callout warning"><div class="co-ico">!</div><div class="co-body"><div class="co-title">Masukkan jawaban</div><p>Masukkan angka pada kolom jawaban terlebih dahulu.</p></div></div>`;
      return;
    }
    const correct = Math.abs(userAns - t) < 0.02;
    answerEl.innerHTML = `<div class="callout ${correct ? 'success' : 'danger'}">
      <div class="co-ico">${correct ? '✓' : '✕'}</div>
      <div class="co-body">
        <div class="co-title">${correct ? 'Tepat!' : 'Belum tepat'}</div>
        <p>Jawaban Anda: <strong>${fmtNum(userAns,2)} mm</strong> · Benar: <strong>${fmtNum(t,2)} mm</strong>.</p>
        <p>Perhatikan: pada inside micrometer arah putar berlawanan dengan outside micrometer.</p>
      </div>
    </div>`;
  });
  draw();
}

/* ===========================================================
   SIMULATOR 4: NILAI SECTION TURNING
   Rumus: Nilai Akhir = (Nilai Kompetensi × 70%) + (Nilai Produksi × 30%)
   =========================================================== */
function bindNilaiSim(pane) {
  const root = $('#nilaiSim', pane);
  if (!root) return;
  const komEl = $('#ns-kom', root);
  const prodEl = $('#ns-prod', root);
  const calcBtn = $('#ns-calc', root);
  const resetBtn = $('#ns-reset', root);
  const out = $('#ns-out', root);

  function calc() {
    const kom = parseFloat(komEl.value);
    const prod = parseFloat(prodEl.value);
    if (isNaN(kom) || isNaN(prod)) {
      out.innerHTML = `<div class="callout warning"><div class="co-ico">!</div><div class="co-body"><div class="co-title">Lengkapi nilai</div><p>Masukkan nilai kompetensi dan nilai produksi terlebih dahulu.</p></div></div>`;
      return;
    }
    if (kom < 0 || kom > 100 || prod < 0 || prod > 100) {
      out.innerHTML = `<div class="callout danger"><div class="co-ico">!</div><div class="co-body"><div class="co-title">Nilai di luar rentang</div><p>Nilai harus berada antara 0 sampai 100.</p></div></div>`;
      return;
    }
    const final = kom * 0.70 + prod * 0.30;
    const status = final >= 75 ? 'LULUS' : 'BELUM LULUS';
    const statusClass = final >= 75 ? 'success' : 'warning';
    const statusIco = final >= 75 ? '✓' : '!';
    out.innerHTML = `
      <div class="sim-result">
        <div class="sr-label">Nilai Akhir Section Turning</div>
        <div class="sr-value">${fmtNum(final, 2)}</div>
      </div>
      <div class="callout ${statusClass}" style="margin-top:12px">
        <div class="co-ico">${statusIco}</div>
        <div class="co-body">
          <div class="co-title">Status: ${status} ${final >= 75 ? '(≥ 75)' : '(< 75)'}</div>
          <p>Perhitungan: (${fmtNum(kom,2)} × 0,70) + (${fmtNum(prod,2)} × 0,30) = ${fmtNum(final, 2)}.</p>
          <p>Catatan: nilai kompetensi tidak dapat diperbaiki; perbaikan nilai hanya berlaku untuk nilai produksi (kualitas & kuantitas).</p>
        </div>
      </div>
    `;
  }
  calcBtn.addEventListener('click', calc);
  resetBtn.addEventListener('click', () => {
    komEl.value = ''; prodEl.value = '';
    out.innerHTML = '';
  });
}

/* ===========================================================
   THREAD IDENTIFIER (interactive)
   =========================================================== */
function bindThreadIdentifier(pane) {
  const root = $('#threadIdentifier', pane);
  if (!root) return;
  const codeEl = $('#ti-code', root);
  const checkBtn = $('#ti-check', root);
  const out = $('#ti-out', root);

  checkBtn.addEventListener('click', () => {
    const code = codeEl.value.trim().toUpperCase();
    if (!code) {
      out.innerHTML = `<div class="callout warning"><div class="co-ico">!</div><div class="co-body"><div class="co-title">Masukkan kode ulir</div><p>Contoh: M10, M24x1,5, W1/2-10, 1/2-6NC</p></div></div>`;
      return;
    }
    let result = '';
    if (/^M\d+(\s*[×xX]\s*\d+([.,]\d+)?)?$/.test(code)) {
      // Metric
      const m = code.match(/^M(\d+)(?:\s*[×xX]\s*(\d+([.,]\d+)?))?$/);
      const major = m[1];
      const pitch = m[2] ? m[2].replace(',', '.') : null;
      result = `<div class="callout success">
        <div class="co-ico">✓</div>
        <div class="co-body">
          <div class="co-title">Ulir Metrik (M)</div>
          <p>Kode: <strong>${esc(code)}</strong></p>
          <p>Diameter mayor: <strong>${major} mm</strong></p>
          ${pitch ? `<p>Pitch: <strong>${pitch} mm</strong></p>` : '<p>Pitch: standar tabel elemen mesin</p>'}
          <p>Sudut profil: 60° (standar metrik)</p>
        </div>
      </div>`;
    } else if (/^W\d+\/\d+-\d+$/.test(code)) {
      const m = code.match(/^W(\d+\/\d+)-(\d+)$/);
      result = `<div class="callout success">
        <div class="co-ico">✓</div>
        <div class="co-body">
          <div class="co-title">Ulir Whitworth (W)</div>
          <p>Kode: <strong>${esc(code)}</strong></p>
          <p>Diameter luar: <strong>${m[1]} inci</strong></p>
          <p>Ulir per inci: <strong>${m[2]}</strong></p>
          <p>Sudut profil: 55° (standar Inggris)</p>
        </div>
      </div>`;
    } else if (/^\d+\/\d+-\d+(NC|NF|NEF|UNC|UNF)$/.test(code)) {
      const m = code.match(/^(\d+\/\d+)-(\d+)(NC|NF|NEF|UNC|UNF)$/);
      result = `<div class="callout success">
        <div class="co-ico">✓</div>
        <div class="co-body">
          <div class="co-title">Ulir Amerika (${m[3]})</div>
          <p>Kode: <strong>${esc(code)}</strong></p>
          <p>Diameter luar: <strong>${m[1]} inci</strong></p>
          <p>Ulir per inci: <strong>${m[2]}</strong></p>
          <p>Sudut profil: 60° (standar Amerika)</p>
        </div>
      </div>`;
    } else {
      result = `<div class="callout warning">
        <div class="co-ico">?</div>
        <div class="co-body">
          <div class="co-title">Format tidak dikenali</div>
          <p>Kode: <strong>${esc(code)}</strong></p>
          <p>Format yang didukung: M10, M24x1,5, W1/2-10, 1/2-6NC. Periksa kembali penulisan kode.</p>
        </div>
      </div>`;
    }
    out.innerHTML = result;
  });
}

/* ===========================================================
   THREAD COMPARISON INTERACTIVE

function bindThreadComparison(pane) {

/* ===========================================================
   QUIZ / EVALUASI
   =========================================================== */
function bindQuiz(pane) {
  $$('[data-quiz]', pane).forEach(quizRoot => {
    const quizId = quizRoot.getAttribute('data-quiz');
    const quiz = QUIZZES[quizId];
    if (!quiz) return;
    let userAnswers = {};
    let checked = false;

    // Render
    quizRoot.innerHTML = `
      ${quiz.questions.map((q, i) => `
        <div class="quiz-q" data-q="${i}">
          <div class="qq-num">SOAL ${String(i+1).padStart(2,'0')} · ${q.type || 'Pilihan Ganda'}</div>
          <div class="qq-text">${esc(q.q)}</div>
          <div class="quiz-options">
            ${q.options.map((opt, j) => `
              <button class="quiz-opt" data-opt="${j}">
                <span class="qo-ico">${String.fromCharCode(65 + j)}</span>
                <span>${esc(opt)}</span>
              </button>
            `).join('')}
          </div>
          <div class="quiz-explain" data-explain="${i}"></div>
        </div>
      `).join('')}
      <div class="quiz-score hidden" id="score-${quizId}">
        <div class="qs-val"><span id="score-val">0</span> / ${quiz.questions.length}</div>
        <div>
          <strong>Skor Akhir</strong>
          <p style="margin:4px 0 0;font-size:13px;color:var(--c-text-3);">Klik "Ulangi" untuk mencoba lagi.</p>
        </div>
      </div>
      <div style="display:flex; gap:8px; margin-top:14px;">
        <button class="btn primary" id="quiz-check-${quizId}">Periksa Jawaban</button>
        <button class="btn ghost" id="quiz-reset-${quizId}">Ulangi</button>
      </div>
    `;

    // Bind option clicks
    $$('.quiz-opt', quizRoot).forEach(opt => {
      opt.addEventListener('click', () => {
        if (checked) return;
        const qi = opt.closest('.quiz-q');
        const qIdx = parseInt(qi.getAttribute('data-q'));
        const optIdx = parseInt(opt.getAttribute('data-opt'));
        userAnswers[qIdx] = optIdx;
        $$('.quiz-opt', qi).forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
      });
    });

    // Check
    $(`#quiz-check-${quizId}`).addEventListener('click', () => {
      checked = true;
      let correct = 0;
      quiz.questions.forEach((q, i) => {
        const qi = $(`.quiz-q[data-q="${i}"]`, quizRoot);
        const opts = $$('.quiz-opt', qi);
        opts.forEach((o, j) => {
          o.classList.remove('selected', 'correct', 'wrong');
          if (j === q.correct) o.classList.add('correct');
          else if (j === userAnswers[i]) o.classList.add('wrong');
        });
        if (userAnswers[i] === q.correct) correct++;
        const expl = $(`[data-explain="${i}"]`, quizRoot);
        expl.innerHTML = `<strong>Pembahasan:</strong> ${esc(q.explain || '')}`;
        expl.classList.add('show');
      });
      $(`#score-val`, quizRoot).textContent = correct;
      $(`#score-${quizId}`).classList.remove('hidden');
    });

    // Reset
    $(`#quiz-reset-${quizId}`).addEventListener('click', () => {
      checked = false;
      userAnswers = {};
      $$('.quiz-opt', quizRoot).forEach(o => o.classList.remove('selected', 'correct', 'wrong'));
      $$('.quiz-explain', quizRoot).forEach(e => { e.classList.remove('show'); e.innerHTML=''; });
      $(`#score-${quizId}`).classList.add('hidden');
    });
  });
}

/* ===========================================================
   GALLERY FILTER
   =========================================================== */
function bindGalleryFilter(pane) {
  const root = $('#galleryFilter', pane);
  if (!root) return;
  const chips = $$('.gallery-chip', root);
  const cards = $$('.gallery-card', pane);
  chips.forEach(c => {
    c.addEventListener('click', () => {
      chips.forEach(x => x.classList.toggle('active', x === c));
      const cat = c.getAttribute('data-filter');
      cards.forEach(card => {
        const cc = card.getAttribute('data-cat') || '';
        card.style.display = (cat === 'all' || cc === cat) ? '' : 'none';
      });
    });
  });
}

/* ===========================================================
   QUIZ DATA (defined in menus where used, fallback here)
   =========================================================== */
const QUIZZES = window.QUIZZES || {};

// ---------- INIT ----------
function init() {
  applyTheme(State.theme);
  renderSidebar();
  navigate('beranda');
  // Theme toggle
  $('#themeToggle').addEventListener('click', toggleTheme);
  // Sidebar toggle (mobile)
  $('#menuToggle').addEventListener('click', () => {
    const app = $('#app');
    const cur = app.getAttribute('data-sidebar');
    if (window.innerWidth <= 1024) {
      app.setAttribute('data-sidebar', cur === 'open' ? 'closed' : 'open');
    } else {
      app.setAttribute('data-sidebar', cur === 'open' ? 'collapsed' : 'open');
    }
  });
  // Home
  $('#homeBtn').addEventListener('click', () => navigate('beranda'));
  // Prev / Next
  $('#prevBtn').addEventListener('click', prevMenu);
  $('#nextBtn').addEventListener('click', nextMenu);
  $('#materialSelect').addEventListener('change', (e) => navigate(e.target.value));
  // Search
  const search = $('#globalSearch');
  search.addEventListener('input', () => performSearch(search.value));
  search.addEventListener('focus', () => { if (search.value) performSearch(search.value); });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) $('#searchResults').classList.remove('open');
  });
  // Glossary
  $('#glossaryBtn').addEventListener('click', openGlossary);
  $('#glossaryClose').addEventListener('click', closeGlossary);
  $('#glossarySearch').addEventListener('input', filterGlossary);
  // Lightbox
  $('#lbClose').addEventListener('click', closeLightbox);
  $('#lbNext').addEventListener('click', lbNext);
  $('#lbPrev').addEventListener('click', lbPrev);
  $('#lbZoomIn').addEventListener('click', () => lbZoom(0.25));
  $('#lbZoomOut').addEventListener('click', () => lbZoom(-0.25));
  $('#lbReset').addEventListener('click', () => { LB_STATE.scale = 1; $('#lbImage').style.transform = 'scale(1)'; });
  $('#lightbox').addEventListener('click', (e) => { if (e.target.id === 'lightbox') closeLightbox(); });
  $('#glossaryModal').addEventListener('click', (e) => { if (e.target.id === 'glossaryModal') closeGlossary(); });
  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closeLightbox(); closeGlossary(); }
    if (e.key === 'ArrowLeft' && !e.target.matches('input,textarea,select')) { if ($('#lightbox').classList.contains('open')) lbPrev(); else prevMenu(); }
    if (e.key === 'ArrowRight' && !e.target.matches('input,textarea,select')) { if ($('#lightbox').classList.contains('open')) lbNext(); else nextMenu(); }
    if (e.key === 't' && !e.target.matches('input,textarea,select')) toggleTheme();
    if (e.key === 'g' && !e.target.matches('input,textarea,select')) openGlossary();
    if (e.key === 'm' && !e.target.matches('input,textarea,select')) $('#menuToggle').click();
  });
  // Close mobile sidebar when clicking backdrop
  $('#app').addEventListener('click', (e) => {
    if (e.target.id === 'app' && window.innerWidth <= 1024) {
      $('#app').setAttribute('data-sidebar', 'closed');
    }
  });
}

document.addEventListener('DOMContentLoaded', init);
